  pageSubscriptions(c) {
    const mCost = (s) => s.cycle === 'yearly' ? s.amount / 12 : s.cycle === 'weekly' ? s.amount * 4.33 : s.amount;
    const CYCLE_LABEL = { weekly: 'Hằng tuần', monthly: 'Hằng tháng', yearly: 'Hằng năm' };
    const subs = Store.data.subscriptions;
    const active = subs.filter((s) => s.status === 'active');

    const head = this.pageHeader('Đăng ký & Hóa đơn', 'Theo dõi các khoản định kỳ trước khi bị bất ngờ.');
    head.appendChild(makeBtn('Thêm', 'btn btn-primary', () => this.openSubModal(), 'plus'));
    c.appendChild(head);

    if (subs.length) {
      const monthly = active.reduce((a, s) => a + mCost(s), 0);
      const due7 = active.filter((s) => { const d = (parseDate(s.next_due) - new Date()) / 86400000; return d >= -1 && d <= 7; }).reduce((a, s) => a + s.amount, 0);
      const stats = el('<div class="grid g3" style="margin-bottom:20px"></div>');
      stats.appendChild(this.statCard('Chi phí/tháng', fmtMoney(monthly), `${active.length} đang hoạt động`, 'repeat', true));
      stats.appendChild(this.statCard('Chi phí/năm', fmtMoney(monthly * 12), 'Dự kiến', 'calendar'));
      stats.appendChild(this.statCard('Đến hạn 7 ngày', fmtMoney(due7), 'Sắp tới', 'calendar'));
      c.appendChild(stats);
    }

    if (!subs.length) {
      const card = el('<div class="card"></div>');
      card.appendChild(emptyState({ icon: 'repeat', title: 'Chưa theo dõi đăng ký nào', message: 'Thêm Netflix, Spotify, phòng gym… bất cứ khoản nào trừ tiền định kỳ.', actionLabel: 'Thêm đăng ký', onAction: () => this.openSubModal() }));
      c.appendChild(card); return;
    }
    const card = el('<div class="card"></div>');
    const ul = el('<ul class="list"></ul>');
    subs.sort((a, b) => (a.next_due < b.next_due ? -1 : 1)).forEach((s) => {
      const paused = s.status !== 'active';
      const li = el(`<li class="li" style="${paused ? 'opacity:.6' : ''}">

        <div class="li-sub">${paused ? 'Không tính phí' : 'Kế tiếp: ' + relativeDay(s.next_due)} · ${CYCLE_LABEL[s.cycle]}</div></div>

      const e = el(`<button class="icon-btn">${icon('pencil', 14)}</button>`); e.onclick = () => this.openSubModal(s);
      const d = el(`<button class="icon-btn danger">${icon('trash', 14)}</button>`); d.onclick = () => confirmDialog({ title: 'Xóa đăng ký', message: `Ngừng theo dõi "${s.name}"?`, onConfirm: () => { Store.deleteSubscription(s.id); Toast.success('Đã xóa'); this.renderPage(); } });
      acts.appendChild(toggle); acts.appendChild(e); acts.appendChild(d); li.appendChild(acts);
      ul.appendChild(li);
    });
    card.appendChild(ul); c.appendChild(card);

      </div>
      <div class="row">
        <div class="field"><label class="label">Ngày đến hạn kế tiếp</label><input class="input" id="sDue" type="date" value="${form.next_due}"></div>
        <div class="field"><label class="label">Danh mục</label><select class="input" id="sCat">${EXPENSE_CATEGORIES.map((cc) => `<option value="${esc(cc.key)}" ${form.category === cc.key ? 'selected' : ''}>${esc(cc.key)}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label class="label">Tài khoản (tùy chọn)</label><select class="input" id="sAcc"><option value="">Không</option>${accounts.map((ac) => `<option value="${ac.id}" ${form.account_id === ac.id ? 'selected' : ''}>${esc(ac.name)}</option>`).join('')}</select></div>
      <div class="field"><label class="label">Màu</label><div class="swatches" id="sColors">${COLORS.map((cl) => `<button type="button" class="swatch ${form.color === cl ? 'on' : ''}" data-c="${cl}" style="background:${cl}"></button>`).join('')}</div></div>
      <div class="err hidden" id="sErr"></div></div>`);
    body.querySelectorAll('#sColors .swatch').forEach((b) => b.onclick = () => { form.color = b.dataset.c; body.querySelectorAll('#sColors .swatch').forEach((x) => x.classList.toggle('on', x.dataset.c === form.color)); });
    const save = makeBtn('Lưu', 'btn btn-primary', () => {
      const name = body.querySelector('#sName').value, amt = parseFloat(body.querySelector('#sAmt').value);
      const err = body.querySelector('#sErr'); const showErr = (m) => { err.textContent = m; err.classList.remove('hidden'); };
      if (!name.trim()) return showErr('Nhập tên');
      if (!amt || amt <= 0) return showErr('Nhập số tiền hợp lệ');
      const payload = { name, amount: amt, cycle: body.querySelector('#sCycle').value, category: body.querySelector('#sCat').value, next_due: body.querySelector('#sDue').value, account_id: body.querySelector('#sAcc').value, color: form.color };
      if (existing) { Store.updateSubscription(existing.id, payload); Toast.success('Đã cập nhật'); }
      else { Store.addSubscription(payload); Toast.success('Đã thêm đăng ký'); }
      Modal.close(); this.renderPage();
    });
    Modal.open({ title: existing ? 'Sửa đăng ký' : 'Thêm đăng ký', body, footer: [makeBtn('Hủy', 'btn btn-ghost', () => Modal.close()), save] });
  },

  /* ========================================================
     PHÂN TÍCH (INSIGHTS)
     ======================================================== */
  pageInsights(c) {
    const a = Store.analytics();
    c.appendChild(this.pageHeader('Phân tích', 'Những gợi ý thông minh từ thói quen chi tiêu của bạn.'));

    const ins = el('<div class="grid g2" style="margin-bottom:20px"></div>');
    a.insights.forEach((it) => {
      const iconName = it.type === 'good' ? 'check-circle' : it.type === 'warn' ? 'alert-triangle' : 'info';
      ins.appendChild(el(`<div class="insight in-${it.type}"><div class="in-ic">${icon(iconName, 18)}</div><div><h4>${esc(it.title)}</h4><p>${esc(it.body)}</p></div></div>`));
    });
    c.appendChild(ins);

    const grid = el('<div class="grid g2" style="margin-bottom:20px"></div>');
    // daily spend
    const dailyCard = el('<div class="card pad"></div>');
    dailyCard.appendChild(el(`<div class="sec-head"><div><h2>Chi tiêu hằng ngày</h2><div class="h-sub">30 ngày gần nhất</div></div></div>`));
    if (a.daily.some((d) => d.amount > 0)) dailyCard.appendChild(el(barChart(a.daily.map((d) => ({ label: d.label, value: d.amount })))));
    else dailyCard.appendChild(emptyState({ icon: 'trending-up', title: 'Chưa có dữ liệu', message: 'Thêm khoản chi để xem biểu đồ.' }));
    grid.appendChild(dailyCard);

    // category breakdown
    const catCard = el('<div class="card pad"></div>');
    catCard.appendChild(el(`<div class="sec-head"><div><h2>Cơ cấu danh mục</h2><div class="h-sub">Tháng này</div></div></div>`));
    if (a.byCategory.length) {
      const max = a.byCategory[0].total;
      const box = el('<div style="display:flex;flex-direction:column;gap:12px"></div>');
      a.byCategory.slice(0, 7).forEach((cc) => box.appendChild(el(`<div><div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px"><span style="display:flex;align-items:center;gap:8px;color:var(--ink-700)"><span class="dot" style="background:${catColor(cc.category)}"></span>${esc(cc.category)}</span><span style="font-weight:600" class="tabular">${fmtMoney(cc.total)}</span></div>${progressBar(cc.total, max, catColor(cc.category), 8)}</div>`)));
      catCard.appendChild(box);
    } else catCard.appendChild(emptyState({ icon: 'trending-up', title: 'Chưa có dữ liệu', message: 'Thêm khoản chi để xem cơ cấu.' }));
    grid.appendChild(catCard);
    c.appendChild(grid);

    // top merchants
    const merCard = el('<div class="card pad"></div>');
    merCard.appendChild(el(`<div class="sec-head"><div><h2 style="display:flex;align-items:center;gap:8px">${icon('store', 16, 'brand')} Nơi chi nhiều nhất</h2><div class="h-sub">Tháng này</div></div></div>`));
    if (a.topMerchants.length) {
      const box = el('<div class="grid g3"></div>');
      a.topMerchants.forEach((m, i) => box.appendChild(el(`<div style="display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--ink-50)"><span style="width:28px;height:28px;border-radius:9px;background:#fff;color:var(--ink-500);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0">#${i + 1}</span><div style="min-width:0;flex:1"><div class="li-title">${esc(m.merchant)}</div><div class="muted" style="font-size:12px">${m.count} lần</div></div><span style="font-weight:600" class="tabular">${fmtMoney(m.total)}</span></div>`)));
      merCard.appendChild(box);
    } else merCard.appendChild(el('<p class="muted" style="font-size:14px">Chưa ghi nhận chi tiêu nào.</p>'));
    c.appendChild(merCard);
  },
});

  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
