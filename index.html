  <style>
/* ============================================================
   PocketWise — Style
   ============================================================ */
:root {
  --brand-50:#eef6ff; --brand-100:#d9eaff; --brand-500:#337bff; --brand-600:#1c5cf5; --brand-700:#1548e1;
  --ink-50:#f6f7f9; --ink-100:#eceef2; --ink-200:#d5dae2; --ink-300:#b0baca; --ink-400:#8593ab;
  --ink-500:#647391; --ink-600:#4f5c78; --ink-700:#414b62; --ink-900:#333847; --ink-950:#22252f;
  --green:#16a34a; --red:#ef4444; --amber:#f59e0b;
  --radius:16px; --shadow-card:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  --shadow-pop:0 12px 40px rgba(16,24,40,.16);
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body {
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--ink-50); color:var(--ink-900); -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
input,select,textarea { font-size:16px; font-family:inherit; }
.muted { color:var(--ink-500); }
.tabular { font-variant-numeric:tabular-nums; }
.hidden { display:none !important; }

/* ---------- Auth/landing ---------- */
.gate { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  background:linear-gradient(135deg,var(--brand-600),var(--brand-800)); }
.gate-card { background:#fff; border-radius:24px; box-shadow:var(--shadow-pop); max-width:420px; width:100%; padding:32px; animation:scaleIn .2s ease-out; }
.gate-logo { width:52px; height:52px; border-radius:15px; background:var(--brand-600); color:#fff; display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
.gate-card h1 { font-size:24px; font-weight:800; letter-spacing:-.02em; }
.gate-card p.sub { color:var(--ink-500); margin-top:6px; font-size:14px; line-height:1.5; }
.feature-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:22px 0; }
.feature { display:flex; align-items:center; gap:9px; font-size:13px; font-weight:500; color:var(--ink-600); }
.feature .fic { width:30px; height:30px; border-radius:9px; background:var(--brand-50); color:var(--brand-500); display:flex; align-items:center; justify-content:center; flex-shrink:0; }

/* ---------- Layout / Shell ---------- */
.app { display:none; min-height:100vh; }
.app.active { display:block; }
.sidebar { position:fixed; inset:0 auto 0 0; width:256px; background:#fff; border-right:1px solid var(--ink-100); display:flex; flex-direction:column; z-index:30; }
.sb-logo { display:flex; align-items:center; gap:10px; padding:0 20px; height:64px; flex-shrink:0; }
.sb-logo .mk { width:36px; height:36px; border-radius:11px; background:var(--brand-600); color:#fff; display:flex; align-items:center; justify-content:center; }
.sb-logo b { font-size:18px; letter-spacing:-.02em; }
.nav { flex:1; padding:8px 12px; overflow-y:auto; }
.nav a { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:12px; font-size:14px; font-weight:500; color:var(--ink-600); text-decoration:none; margin-bottom:2px; transition:.15s; cursor:pointer; }
.nav a .ic { color:var(--ink-400); }
.nav a:hover { background:var(--ink-100); color:var(--ink-900); }
.nav a.active { background:var(--brand-50); color:var(--brand-700); }
.nav a.active .ic { color:var(--brand-600); }
.nav a.active .chev { margin-left:auto; color:var(--brand-500); }
.sb-foot { padding:12px; border-top:1px solid var(--ink-100); }
.sb-user { display:flex; align-items:center; gap:12px; padding:8px; }
.avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#599fff,var(--brand-600)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; }
.sb-user .nm { font-size:14px; font-weight:600; }
.sb-user .em { font-size:12px; color:var(--ink-400); }

.main { padding-left:256px; }
.topbar { display:none; }
.content { padding:24px 32px 32px; max-width:1120px; margin:0 auto; }

/* ---------- Bottom nav (mobile) ---------- */
.botnav { display:none; }

/* ---------- Page header ---------- */
.page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:24px; }
.page-head h1 { font-size:24px; font-weight:800; letter-spacing:-.02em; }
.page-head .ph-sub { color:var(--ink-500); font-size:14px; margin-top:4px; }

/* ---------- Cards ---------- */
.card { background:#fff; border:1px solid var(--ink-100); border-radius:var(--radius); box-shadow:var(--shadow-card); }
.pad { padding:20px; }
.grid { display:grid; gap:16px; }
.g2 { grid-template-columns:repeat(2,1fr); }
.g3 { grid-template-columns:repeat(3,1fr); }
.g4 { grid-template-columns:repeat(4,1fr); }

/* stat card */
.stat { padding:18px 20px; }
.stat .lbl { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-400); }
.stat .val { font-size:24px; font-weight:800; margin-top:8px; }
.stat .sub { font-size:12px; color:var(--ink-400); margin-top:4px; }
.stat .sic { width:32px; height:32px; border-radius:10px; background:var(--brand-50); color:var(--brand-500); display:flex; align-items:center; justify-content:center; }
.stat-head { display:flex; align-items:center; justify-content:space-between; }
.stat.brand { background:linear-gradient(135deg,var(--brand-600),var(--brand-700)); border-color:transparent; color:#fff; }
.stat.brand .lbl, .stat.brand .sub { color:var(--brand-100); }
.stat.brand .sic { background:rgba(255,255,255,.15); color:#fff; }

/* ---------- Buttons ---------- */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:12px; padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; transition:.15s; white-space:nowrap; }
.btn:active { transform:scale(.98); }
.btn:disabled { opacity:.5; pointer-events:none; }
.btn-primary { background:var(--brand-600); color:#fff; }
.btn-primary:hover { background:var(--brand-700); }
.btn-ghost { background:transparent; color:var(--ink-600); }
.btn-ghost:hover { background:var(--ink-100); }
.btn-outline { background:#fff; border:1px solid var(--ink-200); color:var(--ink-700); }
.btn-outline:hover { background:var(--ink-50); }
.btn-danger { background:#fef2f2; color:var(--red); }
.btn-danger:hover { background:#fee2e2; }
.btn-dark { background:var(--ink-900); color:#fff; }
.btn-dark:hover { background:var(--ink-950); }
.btn-block { width:100%; }
.icon-btn { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border:none; background:transparent; color:var(--ink-400); border-radius:9px; cursor:pointer; transition:.15s; }
.icon-btn:hover { background:var(--ink-100); color:var(--ink-700); }
.icon-btn.danger:hover { background:#fef2f2; color:var(--red); }

/* ---------- Forms ---------- */
.field { margin-bottom:14px; }
.label { display:block; font-size:12px; font-weight:600; color:var(--ink-500); margin-bottom:6px; }
.input { width:100%; border:1px solid var(--ink-200); border-radius:12px; padding:10px 14px; font-size:14px; color:var(--ink-900); background:#fff; outline:none; transition:.15s; }
.input:focus { border-color:#8ec2ff; box-shadow:0 0 0 4px var(--brand-100); }
.money-wrap { position:relative; }
.money-wrap .cur { position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--ink-400); font-weight:600; pointer-events:none; }
.money-wrap .input { padding-right:30px; }
.row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.err { font-size:13px; color:var(--red); background:#fef2f2; border-radius:10px; padding:8px 12px; margin-top:4px; }

/* type toggle */
.seg { display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; background:var(--ink-100); border-radius:12px; margin-bottom:14px; }
.seg button { border:none; background:transparent; padding:8px; border-radius:9px; font-size:14px; font-weight:600; color:var(--ink-500); cursor:pointer; transition:.15s; }
.seg button.on { background:#fff; color:var(--ink-900); box-shadow:var(--shadow-card); }

/* category chips */
.cat-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; max-height:190px; overflow-y:auto; }
.cat-chip { display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--ink-200); border-radius:10px; font-size:12px; font-weight:500; color:var(--ink-600); cursor:pointer; text-align:left; background:#fff; transition:.15s; }
.cat-chip:hover { background:var(--ink-50); }
.cat-chip.on { border-color:#8ec2ff; background:var(--brand-50); color:var(--brand-700); }
.dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }

/* color/icon picker */
.swatches { display:flex; gap:8px; flex-wrap:wrap; }
.swatch { width:32px; height:32px; border-radius:50%; border:none; cursor:pointer; transition:.15s; }
.swatch.on { outline:2px solid var(--ink-300); outline-offset:2px; }
.icon-pick { display:flex; gap:8px; flex-wrap:wrap; }
.icon-opt { width:40px; height:40px; border-radius:11px; border:1px solid var(--ink-200); background:#fff; color:var(--ink-400); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s; }
.icon-opt.on { border-color:#8ec2ff; background:var(--brand-50); color:var(--brand-600); }

/* ---------- Lists ---------- */
.tx-group { margin-bottom:16px; }
.tx-group-head { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:rgba(246,247,249,.6); border-bottom:1px solid var(--ink-100); font-size:12px; font-weight:600; color:var(--ink-500); }
.list { list-style:none; }
.li { display:flex; align-items:center; gap:12px; padding:12px 16px; border-top:1px solid var(--ink-100); transition:.12s; }
.li:first-child { border-top:none; }
.li:hover { background:rgba(246,247,249,.5); }
.li:hover .li-actions { opacity:1; }
.li-ic { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.li-main { min-width:0; flex:1; }
.li-title { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.li-sub { font-size:12px; color:var(--ink-400); display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:1px; }
.li-actions { display:flex; gap:2px; opacity:0; transition:.15s; }
.amt { font-weight:700; font-variant-numeric:tabular-nums; }
.amt.income { color:var(--green); }
.amt.expense { color:var(--ink-900); }

/* progress bar */
.pbar { background:var(--ink-100); border-radius:99px; overflow:hidden; width:100%; }
.pbar-fill { height:100%; border-radius:99px; transition:width .5s ease; }

/* empty */
.empty { display:flex; flex-direction:column; align-items:center; text-align:center; padding:56px 24px; }
.empty-ic { width:64px; height:64px; border-radius:18px; background:var(--brand-50); color:var(--brand-500); display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
.empty h3 { font-size:16px; font-weight:700; }
.empty p { font-size:14px; color:var(--ink-500); margin-top:4px; max-width:320px; line-height:1.5; }

/* badges/chips */
.tag { display:inline-flex; align-items:center; gap:5px; border-radius:99px; padding:3px 9px; font-size:11px; font-weight:600; }

/* ---------- Charts ---------- */
.chart { width:100%; height:auto; display:block; }
.chart .ax { font-size:10px; fill:var(--ink-400); }
.donut { display:block; margin:0 auto; }
.legend { display:flex; flex-direction:column; gap:7px; margin-top:12px; }
.legend-row { display:flex; align-items:center; gap:8px; font-size:14px; }
.legend-row .lg-name { color:var(--ink-600); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.legend-row .lg-val { font-weight:600; font-variant-numeric:tabular-nums; }
.donut-wrap { position:relative; }
.donut-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
.donut-center .dc-lbl { font-size:12px; color:var(--ink-400); }
.donut-center .dc-val { font-size:18px; font-weight:800; }

/* insight cards */
.insight { display:flex; gap:12px; padding:16px; border-radius:var(--radius); border:1px solid; background:#fff; }
.insight .in-ic { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.insight h4 { font-size:14px; font-weight:700; }
.insight p { font-size:12px; color:var(--ink-500); margin-top:2px; line-height:1.55; }
.in-good { border-color:#bbf7d0; } .in-good .in-ic { background:#f0fdf4; color:var(--green); }
.in-warn { border-color:#fde68a; } .in-warn .in-ic { background:#fffbeb; color:var(--amber); }
.in-info { border-color:var(--brand-100); } .in-info .in-ic { background:var(--brand-50); color:var(--brand-500); }

/* section title */
.sec-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.sec-head h2 { font-size:16px; font-weight:700; }
.sec-head .h-sub { font-size:12px; color:var(--ink-400); }
.link { font-size:12px; font-weight:600; color:var(--brand-600); cursor:pointer; display:inline-flex; align-items:center; gap:4px; text-decoration:none; }

/* ---------- Modal ---------- */
.modal-overlay { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(34,37,47,.45); backdrop-filter:blur(4px); animation:fadeIn .2s; }
.modal { background:#fff; border-radius:20px; box-shadow:var(--shadow-pop); width:100%; max-height:92vh; display:flex; flex-direction:column; animation:scaleIn .18s ease-out; }
.modal-sm { max-width:400px; } .modal-md { max-width:520px; } .modal-lg { max-width:680px; }
.modal-head { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--ink-100); flex-shrink:0; }
.modal-head h3 { font-size:16px; font-weight:700; }
.modal-body { padding:18px 20px; overflow-y:auto; }
.modal-foot { display:flex; gap:8px; justify-content:flex-end; padding:14px 20px; border-top:1px solid var(--ink-100); flex-shrink:0; }

/* ---------- Toast ---------- */
.toast-wrap { position:fixed; z-index:60; bottom:16px; right:16px; display:flex; flex-direction:column; gap:8px; max-width:360px; }
.toast { display:flex; align-items:flex-start; gap:10px; background:var(--ink-900); color:#fff; border-radius:12px; padding:12px 16px; box-shadow:var(--shadow-pop); font-size:14px; animation:scaleIn .18s; }
.toast-success .ic { color:#4ade80; } .toast-error .ic { color:#f87171; } .toast-info .ic { color:#93c5fd; }
.toast-out { opacity:0; transform:translateX(20px); transition:.25s; }

/* quick amount */
.quick-amts { display:flex; gap:8px; margin-top:10px; }
.quick-amts .btn { flex:1; padding:8px; }

/* skeleton */
.skel { position:relative; overflow:hidden; background:var(--ink-100); border-radius:10px; }
.skel::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent); transform:translateX(-100%); animation:shimmer 1.5s infinite; }

@keyframes shimmer { 100% { transform:translateX(100%); } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes scaleIn { from { opacity:0; transform:scale(.97); } to { opacity:1; transform:scale(1); } }
.fade-in { animation:fadeIn .25s ease-out; }

/* scrollbar */
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-thumb { background:var(--ink-200); border-radius:99px; }
::-webkit-scrollbar-thumb:hover { background:var(--ink-300); }
.no-sb::-webkit-scrollbar { display:none; }

/* ============================================================
   Responsive — iPhone / mobile
   ============================================================ */
@media (max-width:1024px) {
  .sidebar { display:none; }
  .sidebar.drawer-open { display:flex; position:fixed; animation:fadeIn .2s; box-shadow:var(--shadow-pop); }
  .drawer-scrim { display:none; position:fixed; inset:0; z-index:29; background:rgba(34,37,47,.45); backdrop-filter:blur(4px); }
  .drawer-scrim.on { display:block; animation:fadeIn .2s; }
  .main { padding-left:0; }
  .topbar { display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:20; background:rgba(255,255,255,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--ink-100); height:calc(56px + var(--sat)); padding:var(--sat) 16px 0; }
  .topbar .mk { width:28px; height:28px; border-radius:8px; background:var(--brand-600); color:#fff; display:flex; align-items:center; justify-content:center; }
  .topbar b { font-size:16px; }
  .content { padding:16px 16px calc(88px + var(--sab)); }
  .botnav { display:flex; position:fixed; bottom:0; left:0; right:0; z-index:30; background:rgba(255,255,255,.96); backdrop-filter:blur(8px); border-top:1px solid var(--ink-100); padding-bottom:var(--sab); }
  .botnav a { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 0; font-size:11px; font-weight:500; color:var(--ink-400); text-decoration:none; cursor:pointer; }
  .botnav a.active { color:var(--brand-600); }
  .g4 { grid-template-columns:1fr 1fr; }
  .g3 { grid-template-columns:1fr 1fr; }
  .page-head h1 { font-size:22px; }
  .modal-overlay { align-items:flex-end; padding:0; }
  .modal { max-width:100% !important; border-radius:22px 22px 0 0; max-height:94vh; padding-bottom:var(--sab); }
}
@media (max-width:560px) {
  .g2 { grid-template-columns:1fr; }
  .cat-grid { grid-template-columns:1fr 1fr; }
  .row { grid-template-columns:1fr; }
  .feature-grid { grid-template-columns:1fr; }
}
@media (min-width:1025px) {
  .desk-2 { grid-template-columns:2fr 1fr; }
}

function fmtMoney(n) {

  const sign = v < 0 ? '-' : '';
  return sign + Math.abs(v).toLocaleString('vi-VN') + ' ₫';
}
function fmtCompact(n) {
  const v = Number(n || 0);
  const sign = v < 0 ? '-' : '';
  const abs = Math.abs(v);
  if (abs >= 1000000) return sign + (abs / 1000000).toFixed(abs % 1000000 === 0 ? 0 : 1) + 'tr';
  if (abs >= 1000) return sign + Math.round(abs / 1000) + 'k';
  return sign + Math.round(abs);
}

const MONTHS_VI = ['Th1','Th2','Th3','Th4','Th5','Th6','Th7','Th8','Th9','Th10','Th11','Th12'];
function parseDate(d) {
  if (!d) return new Date();
  if (typeof d === 'string') return new Date(d + (d.length === 10 ? 'T00:00:00' : ''));
  return d;

function fmtDate(d) {
  const date = parseDate(d);
  return `${date.getDate()} ${MONTHS_VI[date.getMonth()]}, ${date.getFullYear()}`;

function relativeDay(d) {
  const date = parseDate(d);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((date - today) / 86400000);
  if (diff === 0) return 'Hôm nay';
  if (diff === 1) return 'Ngày mai';
  if (diff === -1) return 'Hôm qua';
  if (diff > 0 && diff < 7) return `Sau ${diff} ngày`;
  if (diff < 0 && diff > -7) return `${-diff} ngày trước`;
  return fmtDateShort(d);
}
function initials(name) {
  return (name || '?').trim().split(/\s+/).map((p) => p[0]).slice(0, 2).join('').toUpperCase();

  return t.content.firstElementChild;
}


/* ===== js/store.js ===== */
/* ============================================================
   PocketWise — Kho dữ liệu (localStorage)
   Thay thế toàn bộ backend. Dữ liệu lưu trong trình duyệt.
   ============================================================ */

const STORE_KEY = 'pocketwise:data:v1';

const DEFAULT_DATA = {
  profile: { name: 'Bạn', currency: 'VND' },
  accounts: [],
  transactions: [],
  budgets: [],
  goals: [],
  subscriptions: [],
};

const Store = {
  data: null,

  load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      this.data = raw ? JSON.parse(raw) : structuredClone(DEFAULT_DATA);
    } catch {
      this.data = structuredClone(DEFAULT_DATA);
    }
    // đảm bảo đủ các mảng
    for (const k of ['accounts', 'transactions', 'budgets', 'goals', 'subscriptions']) {
      if (!Array.isArray(this.data[k])) this.data[k] = [];
    }
    if (!this.data.profile) this.data.profile = { name: 'Bạn', currency: 'VND' };
    return this.data;
  },

  save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); } catch (e) { console.error(e); }
  },

  reset() {
    this.data = structuredClone(DEFAULT_DATA);
    this.save();
  },

  export() { return JSON.stringify(this.data, null, 2); },

  import(json) {
    const parsed = JSON.parse(json);
    this.data = Object.assign(structuredClone(DEFAULT_DATA), parsed);
    this.save();
  },

  /* ---------- Tài khoản ---------- */
  addAccount(a) {
    const row = {
      id: uid(), name: a.name.trim(), type: a.type || 'checking',
      institution: a.institution || '', balance: round2(a.balance) || 0,
      color: a.color || '#337bff', archived: false, created_at: Date.now(),
    };
    this.data.accounts.push(row); this.save(); return row;
  },
  updateAccount(id, patch) {
    const a = this.data.accounts.find((x) => x.id === id);
    if (!a) return null;
    Object.assign(a, {
      name: patch.name != null ? patch.name.trim() : a.name,
      type: patch.type ?? a.type,
      institution: patch.institution !== undefined ? patch.institution : a.institution,
      balance: patch.balance != null ? round2(patch.balance) : a.balance,
      color: patch.color ?? a.color,
    });
    this.save(); return a;
  },
  deleteAccount(id) {
    this.data.accounts = this.data.accounts.filter((x) => x.id !== id);
    // gỡ liên kết giao dịch
    this.data.transactions.forEach((t) => { if (t.account_id === id) t.account_id = null; });
    this.data.subscriptions.forEach((s) => { if (s.account_id === id) s.account_id = null; });
    this.save();
  },
  accountName(id) { const a = this.data.accounts.find((x) => x.id === id); return a ? a.name : ''; },

  applyBalance(tx, sign) {
    if (!tx.account_id) return;
    const a = this.data.accounts.find((x) => x.id === tx.account_id);
    if (!a) return;
    a.balance = round2(a.balance + (tx.type === 'income' ? tx.amount : -tx.amount) * sign);
  },

  /* ---------- Giao dịch ---------- */
  addTransaction(t) {
    const row = {
      id: uid(), account_id: t.account_id || null,
      type: t.type === 'income' ? 'income' : 'expense',
      amount: Math.abs(round2(t.amount)), category: t.category,
      merchant: (t.merchant || '').trim(), note: t.note || '',
      date: t.date || todayStr(), created_at: Date.now(),
    };
    this.data.transactions.push(row);
    this.applyBalance(row, 1);
    this.save(); return row;
  },
  updateTransaction(id, patch) {
    const t = this.data.transactions.find((x) => x.id === id);
    if (!t) return null;
    this.applyBalance(t, -1);
    Object.assign(t, {
      type: patch.type === 'income' ? 'income' : (patch.type === 'expense' ? 'expense' : t.type),
      amount: patch.amount != null ? Math.abs(round2(patch.amount)) : t.amount,
      account_id: patch.account_id !== undefined ? (patch.account_id || null) : t.account_id,
      category: patch.category ?? t.category,
      merchant: patch.merchant != null ? patch.merchant.trim() : t.merchant,
      note: patch.note !== undefined ? patch.note : t.note,
      date: patch.date ?? t.date,
    });
    this.applyBalance(t, 1);
    this.save(); return t;
  },
  deleteTransaction(id) {
    const t = this.data.transactions.find((x) => x.id === id);
    if (t) { this.applyBalance(t, -1); this.data.transactions = this.data.transactions.filter((x) => x.id !== id); this.save(); }
  },

  /* ---------- Ngân sách ---------- */
  addBudget(b) {
    const row = { id: uid(), category: b.category, amount: round2(b.amount), created_at: Date.now() };
    this.data.budgets.push(row); this.save(); return row;
  },
  updateBudget(id, patch) {
    const b = this.data.budgets.find((x) => x.id === id);
    if (!b) return null;
    if (patch.amount != null) b.amount = round2(patch.amount);
    if (patch.category) b.category = patch.category;
    this.save(); return b;
  },
  deleteBudget(id) { this.data.budgets = this.data.budgets.filter((x) => x.id !== id); this.save(); },

  /* ---------- Mục tiêu ---------- */
  addGoal(g) {
    const row = {
      id: uid(), name: g.name.trim(), target_amount: round2(g.target_amount),
      saved_amount: round2(g.saved_amount) || 0, target_date: g.target_date || '',
      color: g.color || '#16a34a', icon: g.icon || 'target', created_at: Date.now(),
    };
    this.data.goals.push(row); this.save(); return row;
  },
  updateGoal(id, patch) {
    const g = this.data.goals.find((x) => x.id === id);
    if (!g) return null;
    Object.assign(g, {
      name: patch.name != null ? patch.name.trim() : g.name,
      target_amount: patch.target_amount != null ? round2(patch.target_amount) : g.target_amount,
      saved_amount: patch.saved_amount != null ? Math.max(0, round2(patch.saved_amount)) : g.saved_amount,
      target_date: patch.target_date !== undefined ? patch.target_date : g.target_date,
      color: patch.color ?? g.color,
      icon: patch.icon ?? g.icon,
    });
    this.save(); return g;
  },
  deleteGoal(id) { this.data.goals = this.data.goals.filter((x) => x.id !== id); this.save(); },

  /* ---------- Đăng ký ---------- */
  addSubscription(s) {
    const row = {
      id: uid(), name: s.name.trim(), amount: round2(s.amount),
      cycle: s.cycle || 'monthly', category: s.category || 'Đăng ký (Subscription)',
      next_due: s.next_due || todayStr(), account_id: s.account_id || null,
      status: s.status || 'active', color: s.color || '#8b5cf6', created_at: Date.now(),
    };
    this.data.subscriptions.push(row); this.save(); return row;
  },
  updateSubscription(id, patch) {
    const s = this.data.subscriptions.find((x) => x.id === id);
    if (!s) return null;
    Object.assign(s, {
      name: patch.name != null ? patch.name.trim() : s.name,
      amount: patch.amount != null ? round2(patch.amount) : s.amount,
      cycle: patch.cycle ?? s.cycle,
      category: patch.category ?? s.category,
      next_due: patch.next_due ?? s.next_due,
      account_id: patch.account_id !== undefined ? (patch.account_id || null) : s.account_id,
      status: patch.status ?? s.status,
      color: patch.color ?? s.color,
    });
    this.save(); return s;
  },
  deleteSubscription(id) { this.data.subscriptions = this.data.subscriptions.filter((x) => x.id !== id); this.save(); },

  /* ============================================================
     Phân tích (analytics) — tính toán từ dữ liệu
     ============================================================ */
  monthKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; },

  analytics() {
    const now = new Date();
    const monthStart = `${this.monthKey(now)}-01`;
    const txns = this.data.transactions;

    const inMonth = (t) => t.date >= monthStart;
    const income = txns.filter((t) => t.type === 'income' && inMonth(t)).reduce((a, t) => a + t.amount, 0);
    const expense = txns.filter((t) => t.type === 'expense' && inMonth(t)).reduce((a, t) => a + t.amount, 0);
    const netWorth = this.data.accounts.filter((a) => !a.archived).reduce((a, x) => a + x.balance, 0);

    // theo danh mục (tháng này)
    const catMap = {};
    txns.filter((t) => t.type === 'expense' && inMonth(t)).forEach((t) => {
      catMap[t.category] = catMap[t.category] || { category: t.category, total: 0, count: 0 };
      catMap[t.category].total += t.amount; catMap[t.category].count++;
    });
    const byCategory = Object.values(catMap).sort((a, b) => b.total - a.total)
      .map((c) => ({ ...c, total: round2(c.total) }));

    // xu hướng 6 tháng
    const trend = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const start = `${this.monthKey(d)}-01`;
      const end = `${this.monthKey(new Date(d.getFullYear(), d.getMonth() + 1, 1))}-01`;
      const inc = txns.filter((t) => t.type === 'income' && t.date >= start && t.date < end).reduce((a, t) => a + t.amount, 0);
      const exp = txns.filter((t) => t.type === 'expense' && t.date >= start && t.date < end).reduce((a, t) => a + t.amount, 0);
      trend.push({ month: MONTHS_VI[d.getMonth()], income: round2(inc), expense: round2(exp), net: round2(inc - exp) });
    }

    // chi tiêu hằng ngày 30 ngày
    const daily = [];
    const dailyMap = {};
    txns.filter((t) => t.type === 'expense').forEach((t) => { dailyMap[t.date] = (dailyMap[t.date] || 0) + t.amount; });
    for (let i = 29; i >= 0; i--) {
      const d = new Date(now); d.setDate(now.getDate() - i);
      const k = ymd(d);
      daily.push({ date: k, label: `${d.getDate()}/${d.getMonth() + 1}`, amount: round2(dailyMap[k] || 0) });
    }

    // trung bình 3 tháng
    const past3Start = `${this.monthKey(new Date(now.getFullYear(), now.getMonth() - 3, 1))}-01`;
    const monthly = {};
    txns.filter((t) => t.type === 'expense' && t.date >= past3Start && t.date < monthStart)
      .forEach((t) => { const k = t.date.slice(0, 7); monthly[k] = (monthly[k] || 0) + t.amount; });
    const monthsArr = Object.values(monthly);
    const avgMonthlyExpense = monthsArr.length ? monthsArr.reduce((a, b) => a + b, 0) / monthsArr.length : expense;

    // top merchant
    const merMap = {};
    txns.filter((t) => t.type === 'expense' && inMonth(t)).forEach((t) => {
      merMap[t.merchant] = merMap[t.merchant] || { merchant: t.merchant, total: 0, count: 0 };
      merMap[t.merchant].total += t.amount; merMap[t.merchant].count++;
    });
    const topMerchants = Object.values(merMap).sort((a, b) => b.total - a.total).slice(0, 6)
      .map((m) => ({ ...m, total: round2(m.total) }));

    // chi phí đăng ký / tháng
    const subsMonthly = this.data.subscriptions.filter((s) => s.status === 'active')
      .reduce((a, s) => a + (s.cycle === 'yearly' ? s.amount / 12 : s.cycle === 'weekly' ? s.amount * 4.33 : s.amount), 0);

    const forecast = this.forecast(now, netWorth);
    const insights = this.insights({ income, expense, avgMonthlyExpense, byCategory, subsMonthly, forecast });
    const savingsRate = income > 0 ? Math.max(0, ((income - expense) / income) * 100) : 0;

    return {
      summary: {
        income: round2(income), expense: round2(expense), net: round2(income - expense),
        netWorth: round2(netWorth), savingsRate: round2(savingsRate),
        avgMonthlyExpense: round2(avgMonthlyExpense), subsMonthly: round2(subsMonthly),
      },
      byCategory, trend, daily, topMerchants, forecast, insights,
    };
  },

  forecast(now, startBalance) {
    const txns = this.data.transactions;
    const from = new Date(now); from.setDate(now.getDate() - 60);
    const fromStr = ymd(from);
    const inc = txns.filter((t) => t.type === 'income' && t.date >= fromStr).reduce((a, t) => a + t.amount, 0);
    const exp = txns.filter((t) => t.type === 'expense' && t.date >= fromStr).reduce((a, t) => a + t.amount, 0);
    const dailyNet = (inc - exp) / 60;
    const subs = this.data.subscriptions.filter((s) => s.status === 'active');

    const points = [];
    let bal = startBalance;
    const upcoming = [];
    for (let i = 0; i <= 90; i++) {
      const d = new Date(now); d.setDate(now.getDate() + i);
      const dk = ymd(d);
      if (i > 0) bal += dailyNet;
      for (const s of subs) {
        const stepDays = s.cycle === 'weekly' ? 7 : s.cycle === 'yearly' ? 365 : 30;
        for (let occ = new Date(s.next_due + 'T00:00:00'); occ <= d; occ.setDate(occ.getDate() + stepDays)) {
          if (ymd(occ) === dk) { bal -= s.amount; upcoming.push({ date: dk, name: s.name, amount: round2(s.amount) }); }
        }
      }
      if (i % 3 === 0 || i === 90) points.push({ date: dk, label: `${d.getDate()}/${d.getMonth() + 1}`, balance: round2(bal) });
    }
    const lowest = points.reduce((m, p) => Math.min(m, p.balance), Infinity);
    return { points, dailyNet: round2(dailyNet), endBalance: round2(bal), lowest: round2(lowest === Infinity ? 0 : lowest), upcoming: upcoming.slice(0, 8) };
  },

  insights({ income, expense, avgMonthlyExpense, byCategory, subsMonthly, forecast }) {
    const out = [];
    const vnd = (n) => fmtMoney(n);
    if (byCategory.length) {
      const top = byCategory[0];
      out.push({ type: 'info', title: 'Danh mục chi nhiều nhất', body: `${top.category} là khoản chi lớn nhất tháng này với ${vnd(top.total)} qua ${top.count} giao dịch.` });
    }
    const net = income - expense;
    if (net < 0) out.push({ type: 'warn', title: 'Chi vượt thu', body: `Tháng này bạn chi nhiều hơn thu ${vnd(-net)}. Cân nhắc cắt giảm các khoản không thiết yếu.` });
    else if (income > 0) out.push({ type: 'good', title: 'Dòng tiền dương', body: `Tháng này bạn tiết kiệm được ${vnd(net)} — tỷ lệ ${Math.round((net / income) * 100)}%. Tiếp tục nhé!` });
    if (expense > avgMonthlyExpense * 1.15 && avgMonthlyExpense > 0)
      out.push({ type: 'warn', title: 'Chi tiêu cao hơn trung bình', body: `Cao hơn ${Math.round(((expense / avgMonthlyExpense) - 1) * 100)}% so với trung bình 3 tháng (${vnd(avgMonthlyExpense)}).` });
    if (subsMonthly > 0) out.push({ type: 'info', title: 'Chi phí định kỳ', body: `Đăng ký & hóa đơn tốn khoảng ${vnd(subsMonthly)}/tháng (${vnd(subsMonthly * 12)}/năm).` });
    if (forecast.lowest < 0) out.push({ type: 'warn', title: 'Dự báo: số dư sắp thấp', body: `Số dư có thể giảm còn ${vnd(forecast.lowest)} trong 90 ngày. Hãy tạo khoản dự phòng.` });
    else if (forecast.endBalance !== 0 || forecast.dailyNet !== 0) out.push({ type: 'good', title: 'Dự báo ổn định', body: `Số dư dự kiến sau 90 ngày ~ ${vnd(forecast.endBalance)}, luôn dương.` });
    if (!out.length) out.push({ type: 'info', title: 'Bắt đầu theo dõi', body: 'Thêm vài giao dịch để PocketWise phân tích và gợi ý cho bạn.' });
    return out;
  },
};


/* ===== js/components.js ===== */
/* ============================================================
   PocketWise — Thành phần UI dùng chung
   Modal, Toast, Confirm, EmptyState, biểu đồ SVG
   ============================================================ */

/* ---------- Toast ---------- */
const Toast = {
  container: null,
  init() {
    this.container = el('<div class="toast-wrap"></div>');
    document.body.appendChild(this.container);
  },
  show(msg, type = 'success') {
    const iconName = type === 'success' ? 'check-circle' : type === 'error' ? 'alert-triangle' : 'info';
    const t = el(`<div class="toast toast-${type}">${icon(iconName, 18)}<span>${esc(msg)}</span></div>`);
    this.container.appendChild(t);
    setTimeout(() => { t.classList.add('toast-out'); setTimeout(() => t.remove(), 250); }, 3000);
  },
  success(m) { this.show(m, 'success'); },
  error(m) { this.show(m, 'error'); },
  info(m) { this.show(m, 'info'); },
};

/* ---------- Modal ---------- */
const Modal = {
  el: null,
  open({ title, body, footer, size = 'md', onClose }) {
    this.close();
    const overlay = el(`
      <div class="modal-overlay">
        <div class="modal modal-${size}">
          <div class="modal-head">
            <h3>${esc(title)}</h3>
            <button class="icon-btn modal-x">${icon('x', 18)}</button>
          </div>
          <div class="modal-body"></div>
          <div class="modal-foot"></div>
        </div>
      </div>`);
    overlay.querySelector('.modal-body').appendChild(typeof body === 'string' ? el(`<div>${body}</div>`) : body);
    const foot = overlay.querySelector('.modal-foot');
    if (footer) footer.forEach((b) => foot.appendChild(b)); else foot.remove();

    const doClose = () => { this.close(); onClose && onClose(); };
    overlay.querySelector('.modal-x').onclick = doClose;
    overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) doClose(); });
    this._esc = (e) => { if (e.key === 'Escape') doClose(); };
    document.addEventListener('keydown', this._esc);

    document.body.appendChild(overlay);
    document.body.style.overflow = 'hidden';
    this.el = overlay;
    // focus first input
    setTimeout(() => { const inp = overlay.querySelector('input,select,textarea'); inp && inp.focus(); }, 50);
    return overlay;
  },
  close() {
    if (this.el) { this.el.remove(); this.el = null; document.body.style.overflow = ''; }
    if (this._esc) { document.removeEventListener('keydown', this._esc); this._esc = null; }
  },
};

function makeBtn(label, cls, onClick, iconName) {
  const b = el(`<button class="${cls}">${iconName ? icon(iconName, 15) : ''}<span>${esc(label)}</span></button>`);
  b.onclick = onClick;
  return b;
}

/* ---------- Confirm ---------- */
function confirmDialog({ title, message, confirmLabel = 'Xóa', danger = true, onConfirm }) {
  const cancel = makeBtn('Hủy', 'btn btn-ghost', () => Modal.close());
  const ok = makeBtn(confirmLabel, danger ? 'btn btn-danger' : 'btn btn-primary', async () => {
    ok.disabled = true;
    try { await onConfirm(); } finally { Modal.close(); }
  });
  Modal.open({ title, size: 'sm', body: `<p class="muted" style="line-height:1.6">${esc(message)}</p>`, footer: [cancel, ok] });
}

/* ---------- Empty state ---------- */
function emptyState({ icon: ic, title, message, actionLabel, onAction }) {
  const wrap = el(`
    <div class="empty">
      <div class="empty-ic">${icon(ic || 'info', 28)}</div>
      <h3>${esc(title)}</h3>
      <p>${esc(message)}</p>
    </div>`);
  if (actionLabel) {
    const b = makeBtn(actionLabel, 'btn btn-primary', onAction, 'plus');
    b.style.marginTop = '18px';
    wrap.appendChild(b);
  }
  return wrap;
}

/* ---------- Progress bar ---------- */
function progressBar(value, max, color, height = 8) {
  const pct = Math.min(100, Math.max(0, (value / (max || 1)) * 100));
  return `<div class="pbar" style="height:${height}px"><div class="pbar-fill" style="width:${pct}%;background:${color}"></div></div>`;
}

/* ============================================================
   Biểu đồ vẽ bằng SVG thuần
   ============================================================ */

/* Line/Area chart nhiều chuỗi */
function areaChart(series, { height = 220, showAxis = true } = {}) {
  // series: [{ name, color, data: [{label, value}] }]
  const W = 640, H = height, padL = 44, padR = 12, padT = 12, padB = 24;
  const all = series.flatMap((s) => s.data.map((d) => d.value));
  const maxV = Math.max(1, ...all);
  const minV = Math.min(0, ...all);
  const n = series[0]?.data.length || 1;
  const iw = W - padL - padR, ih = H - padT - padB;
  const x = (i) => padL + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw);
  const y = (v) => padT + ih - ((v - minV) / (maxV - minV || 1)) * ih;

  let svg = `<svg viewBox="0 0 ${W} ${H}" class="chart" preserveAspectRatio="none">`;
  // grid
  if (showAxis) {
    for (let g = 0; g <= 3; g++) {
      const gy = padT + (g / 3) * ih;
      const gv = maxV - (g / 3) * (maxV - minV);
      svg += `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" stroke="#eceef2" stroke-width="1"/>`;
      svg += `<text x="${padL - 6}" y="${gy + 3}" text-anchor="end" class="ax">${fmtCompact(gv)}</text>`;
    }
  }
  series.forEach((s) => {
    const pts = s.data.map((d, i) => `${x(i)},${y(d.value)}`).join(' ');
    const area = `${padL},${y(minV)} ${pts} ${x(n - 1)},${y(minV)}`;
    const gid = 'g' + Math.random().toString(36).slice(2, 7);
    svg += `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${s.color}" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>`;
    svg += `<polygon points="${area}" fill="url(#${gid})"/>`;
    svg += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  // x labels (thưa)
  const step = Math.ceil(n / 6);
  series[0]?.data.forEach((d, i) => {
    if (i % step === 0 || i === n - 1) svg += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" class="ax">${esc(d.label)}</text>`;
  });
  svg += '</svg>';
  return svg;
}

/* Bar chart */
function barChart(data, { height = 200, color = '#337bff' } = {}) {
  const W = 640, H = height, padL = 44, padR = 12, padT = 10, padB = 24;
  const maxV = Math.max(1, ...data.map((d) => d.value));
  const iw = W - padL - padR, ih = H - padT - padB;
  const n = data.length;
  const bw = (iw / n) * 0.6;
  let svg = `<svg viewBox="0 0 ${W} ${H}" class="chart" preserveAspectRatio="none">`;
  for (let g = 0; g <= 3; g++) {
    const gy = padT + (g / 3) * ih;
    svg += `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" stroke="#eceef2" stroke-width="1"/>`;
    svg += `<text x="${padL - 6}" y="${gy + 3}" text-anchor="end" class="ax">${fmtCompact(maxV - (g / 3) * maxV)}</text>`;
  }
  data.forEach((d, i) => {
    const cx = padL + (i / n) * iw + (iw / n) / 2;
    const h = (d.value / maxV) * ih;
    svg += `<rect x="${cx - bw / 2}" y="${padT + ih - h}" width="${bw}" height="${h}" rx="3" fill="${color}"><title>${esc(d.label)}: ${fmtMoney(d.value)}</title></rect>`;
  });
  const step = Math.ceil(n / 8);
  data.forEach((d, i) => { if (i % step === 0 || i === n - 1) svg += `<text x="${padL + (i / n) * iw + (iw / n) / 2}" y="${H - 6}" text-anchor="middle" class="ax">${esc(d.label)}</text>`; });
  svg += '</svg>';
  return svg;
}

/* Donut chart */
function donutChart(items, { size = 170, thickness = 22 } = {}) {
  const total = items.reduce((a, x) => a + x.value, 0) || 1;
  const r = size / 2 - thickness / 2;
  const cx = size / 2, cy = size / 2;
  const circ = 2 * Math.PI * r;
  let offset = 0;
  let svg = `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" class="donut">`;
  svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#eceef2" stroke-width="${thickness}"/>`;
  items.forEach((it) => {
    const frac = it.value / total;
    const len = frac * circ;
    svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${it.color}" stroke-width="${thickness}"
      stroke-dasharray="${len} ${circ - len}" stroke-dashoffset="${-offset}"
      transform="rotate(-90 ${cx} ${cy})"><title>${esc(it.label)}: ${fmtMoney(it.value)}</title></circle>`;
    offset += len;
  });
  svg += '</svg>';
  return svg;
}

];

const App = {
  route: 'overview',

  init() {
    Store.load();

    this.renderPage();
    this.closeDrawer();
    document.querySelector('.content').scrollTo?.(0, 0);
    window.scrollTo(0, 0);
  },

  /* ---------- Shell ---------- */

            </div>

  renderNav() {
    const nav = document.getElementById('nav');

      <a class="${n.id === this.route ? 'active' : ''}" onclick="App.go('${n.id}')">

        ${n.id === this.route ? `<span class="chev">${icon('chevron-right', 15)}</span>` : ''}

    // recent transactions
    const recentCard = el('<div class="card pad"></div>');

      const ul = el('<ul class="list"></ul>');

    } else {
      recentCard.appendChild(emptyState({ icon: 'wallet', title: 'Chưa có giao dịch', message: 'Bắt đầu bằng cách thêm khoản thu hoặc chi đầu tiên.', actionLabel: 'Thêm giao dịch', onAction: () => this.openTxModal() }));

    const rail = el('<div class="grid" style="gap:16px"></div>');
    const goalCard = el('<div class="card pad"></div>');
    goalCard.appendChild(el(`<div class="sec-head"><h2 style="display:flex;align-items:center;gap:8px">${icon('target', 16, 'brand')} Mục tiêu</h2><a class="link" onclick="App.go('goals')">Tất cả</a></div>`));

    if (goals.length) goals.forEach((g) => {
      const pct = Math.min(100, (g.saved_amount / g.target_amount) * 100);
      goalCard.appendChild(el(`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><span style="font-weight:500;color:var(--ink-700)">${esc(g.name)}</span><span class="muted tabular">${Math.round(pct)}%</span></div>${progressBar(g.saved_amount, g.target_amount, g.color, 6)}</div>`));
    });
    else goalCard.appendChild(el('<p class="muted" style="font-size:14px">Chưa có mục tiêu nào.</p>'));
    rail.appendChild(goalCard);

    const billCard = el('<div class="card pad"></div>');
    billCard.appendChild(el(`<div class="sec-head"><h2 style="display:flex;align-items:center;gap:8px">${icon('repeat', 16, 'brand')} Sắp thanh toán</h2><a class="link" onclick="App.go('subscriptions')">Tất cả</a></div>`));
    const subs = Store.data.subscriptions.filter((x) => x.status === 'active').sort((a, b) => (a.next_due < b.next_due ? -1 : 1)).slice(0, 3);
    if (subs.length) { const ul = el('<ul class="list" style="margin:-4px 0"></ul>'); subs.forEach((sub) => ul.appendChild(el(`<li style="display:flex;align-items:center;gap:12px;padding:9px 0;border:none"><span style="width:8px;height:32px;border-radius:99px;background:${sub.color}"></span><div style="min-width:0;flex:1"><div class="li-title">${esc(sub.name)}</div><div class="li-sub">${relativeDay(sub.next_due)}</div></div><span class="amt expense">${fmtMoney(sub.amount)}</span></li>`))); billCard.appendChild(ul); }
    else billCard.appendChild(el('<p class="muted" style="font-size:14px">Không có khoản nào sắp đến hạn.</p>'));
    rail.appendChild(billCard);
    grid.appendChild(rail);

    c.appendChild(grid);
  },

  statCard(lbl, val, sub, ic, brand) {
    return el(`<div class="card stat ${brand ? 'brand' : ''}">
      <div class="stat-head"><span class="lbl">${esc(lbl)}</span><span class="sic">${icon(ic, 16)}</span></div>
      <div class="val tabular">${esc(val)}</div><div class="sub">${esc(sub)}</div></div>`);
  },

  txRow(t, withActions = true) {
    const li = el(`<li class="li">
      <div class="li-ic" style="background:${catColor(t.category)}1a;color:${catColor(t.category)}">${icon(t.type === 'income' ? 'arrow-up-right' : 'arrow-down-right', 16)}</div>
      <div class="li-main"><div class="li-title">${esc(t.merchant)}</div>
      <div class="li-sub"><span class="dot" style="width:6px;height:6px;background:${catColor(t.category)}"></span>${esc(t.category)}${t.account_id ? ' · ' + esc(Store.accountName(t.account_id)) : ''}${t.note ? ' · ' + esc(t.note) : ''}</div></div>
      <span class="amt ${t.type}">${t.type === 'income' ? '+' : '−'}${fmtMoney(t.amount)}</span></li>`);
    if (withActions) {
      const acts = el('<div class="li-actions"></div>');
      const e = el(`<button class="icon-btn">${icon('pencil', 14)}</button>`); e.onclick = () => this.openTxModal(t);
      const d = el(`<button class="icon-btn danger">${icon('trash', 14)}</button>`); d.onclick = () => this.deleteTx(t);
      acts.appendChild(e); acts.appendChild(d); li.appendChild(acts);
    }
    return li;
  },

  /* ========================================================
     GIAO DỊCH
     ======================================================== */
  pageTransactions(c) {
    const head = this.pageHeader('Giao dịch', 'Mọi khoản thu và chi ở một nơi.');
    head.appendChild(makeBtn('Thêm', 'btn btn-primary', () => this.openTxModal(), 'plus'));
    c.appendChild(head);

    // filter bar
    const bar = el('<div style="display:flex;gap:8px;margin-bottom:12px"></div>');
    const searchWrap = el(`<div style="position:relative;flex:1">${icon('search', 16, '')}<input class="input" id="txSearch" placeholder="Tìm mô tả, danh mục, ghi chú…" style="padding-left:38px" value="${esc(this.txFilter.search)}"></div>`);
    searchWrap.querySelector('.ic').style.cssText = 'position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-400)';
    bar.appendChild(searchWrap);

    const exportBtn = el(`<button class="btn btn-outline">${icon('download', 16)}</button>`); exportBtn.onclick = () => this.exportCsv();

    c.appendChild(bar);

    // filter panel
    const fp = el('<div class="card pad hidden" id="filterPanel" style="margin-bottom:12px;display:flex;gap:12px;flex-wrap:wrap"></div>');
    fp.appendChild(el(`<div style="flex:1;min-width:140px"><label class="label">Loại</label><select class="input" id="fType"><option value="">Tất cả</option><option value="expense">Chi</option><option value="income">Thu</option></select></div>`));
    const catOpts = [...EXPENSE_CATEGORIES, ...INCOME_CATEGORIES].map((x) => `<option value="${esc(x.key)}">${esc(x.key)}</option>`).join('');
    fp.appendChild(el(`<div style="flex:1;min-width:140px"><label class="label">Danh mục</label><select class="input" id="fCat"><option value="">Tất cả</option>${catOpts}</select></div>`));
    c.appendChild(fp);
    if (this.txFilter.type || this.txFilter.category) fp.classList.remove('hidden');
    fp.querySelector('#fType').value = this.txFilter.type;
    fp.querySelector('#fCat').value = this.txFilter.category;

    const listWrap = el('<div id="txList"></div>');
    c.appendChild(listWrap);
    this.renderTxList();

    // events
    let deb;
    searchWrap.querySelector('#txSearch').addEventListener('input', (e) => {
      clearTimeout(deb); deb = setTimeout(() => { this.txFilter.search = e.target.value; this.renderTxList(); }, 200);
    });
    fp.querySelector('#fType').onchange = (e) => { this.txFilter.type = e.target.value; this.renderTxList(); };
    fp.querySelector('#fCat').onchange = (e) => { this.txFilter.category = e.target.value; this.renderTxList(); };
  },

  toggleFilters() { document.getElementById('filterPanel').classList.toggle('hidden'); },

  filteredTx() {
    const f = this.txFilter;
    let rows = [...Store.data.transactions];
    if (f.type) rows = rows.filter((t) => t.type === f.type);
    if (f.category) rows = rows.filter((t) => t.category === f.category);
    if (f.search) {
      const s = f.search.toLowerCase();
      rows = rows.filter((t) => (t.merchant + ' ' + t.category + ' ' + (t.note || '')).toLowerCase().includes(s));
    }
    return rows.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.created_at - a.created_at));
  },

  renderTxList() {
    const wrap = document.getElementById('txList');
    if (!wrap) return;
    const rows = this.filteredTx();
    const hasFilters = this.txFilter.search || this.txFilter.type || this.txFilter.category;
    wrap.innerHTML = '';
    if (!rows.length) {
      const card = el('<div class="card"></div>');
      card.appendChild(emptyState({
        icon: 'receipt',
        title: hasFilters ? 'Không tìm thấy giao dịch' : 'Chưa có giao dịch',
        message: hasFilters ? 'Thử điều chỉnh tìm kiếm hoặc bộ lọc.' : 'Thêm khoản thu/chi đầu tiên để bắt đầu.',
        actionLabel: hasFilters ? null : 'Thêm giao dịch', onAction: () => this.openTxModal(),
      }));
      wrap.appendChild(card);
      return;
    }
    // group by date
    const groups = {};
    rows.forEach((t) => { (groups[t.date] = groups[t.date] || []).push(t); });
    Object.keys(groups).sort((a, b) => (a < b ? 1 : -1)).forEach((date) => {
      const items = groups[date];
      const dayTotal = items.reduce((a, t) => a + (t.type === 'income' ? t.amount : -t.amount), 0);
      const card = el('<div class="card tx-group"></div>');
      card.appendChild(el(`<div class="tx-group-head"><span>${fmtDate(date)}</span><span class="${dayTotal >= 0 ? '' : ''}" style="color:${dayTotal >= 0 ? 'var(--green)' : 'var(--ink-500)'}">${dayTotal >= 0 ? '+' : '−'}${fmtMoney(Math.abs(dayTotal))}</span></div>`));
      const ul = el('<ul class="list"></ul>');
      items.forEach((t) => ul.appendChild(this.txRow(t, true)));
      card.appendChild(ul);
      wrap.appendChild(card);
    });
    wrap.appendChild(el(`<p class="muted" style="text-align:center;font-size:12px;padding-top:4px">${rows.length} giao dịch</p>`));
  },

  deleteTx(t) {
    confirmDialog({
      title: 'Xóa giao dịch',
      message: `Xóa "${t.merchant}" trị giá ${fmtMoney(t.amount)}? Không thể hoàn tác.`,
      onConfirm: () => { Store.deleteTransaction(t.id); Toast.success('Đã xóa giao dịch'); this.renderPage(); },
    });
  },

  exportCsv() {
    const rows = [['Ngày', 'Loại', 'Số tiền', 'Danh mục', 'Mô tả', 'Tài khoản', 'Ghi chú']];
    this.filteredTx().forEach((t) => rows.push([t.date, t.type === 'income' ? 'Thu' : 'Chi', t.amount, t.category, t.merchant, Store.accountName(t.account_id), t.note || '']));
    if (rows.length === 1) return Toast.info('Không có dữ liệu để xuất');
    const csv = '\uFEFF' + rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    const a = document.createElement('a'); a.href = url; a.download = 'giao-dich.csv'; a.click();
    URL.revokeObjectURL(url); Toast.success('Đã xuất CSV');
  },
