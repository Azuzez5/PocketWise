          <button class="${form.type === 'income' ? 'on' : ''}" data-t="income">Thu</button>
        </div>
        <div class="field"><label class="label">Số tiền</label>
          <div class="money-wrap"><input class="input" id="fAmt" type="number" inputmode="numeric" step="1000" min="0" placeholder="0" value="${form.amount}"><span class="cur">₫</span></div></div>
        <div class="field"><label class="label">Danh mục</label>
          <div class="cat-grid" id="fCats">${cats.map((cc) => `<button type="button" class="cat-chip ${form.category === cc.key ? 'on' : ''}" data-c="${esc(cc.key)}"><span class="dot" style="background:${cc.color}"></span><span style="overflow:hidden;text-overflow:ellipsis">${esc(cc.key)}</span></button>`).join('')}</div></div>
        <div class="field"><label class="label">Mô tả</label><input class="input" id="fMerch" placeholder="VD: Highlands, Grab, Đi chợ" value="${esc(form.merchant)}"></div>
        <div class="row">
          <div class="field"><label class="label">Ngày</label><input class="input" id="fDate" type="date" value="${form.date}"></div>
          <div class="field"><label class="label">Tài khoản</label><select class="input" id="fAcc"><option value="">Không</option>${accounts.map((ac) => `<option value="${ac.id}" ${form.account_id === ac.id ? 'selected' : ''}>${esc(ac.name)}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label class="label">Ghi chú (tùy chọn)</label><input class="input" id="fNote" placeholder="Thêm ghi chú" value="${esc(form.note)}"></div>
        <div class="err hidden" id="fErr"></div>`;
      body.querySelectorAll('.seg button').forEach((b) => b.onclick = () => { form.type = b.dataset.t; form.category = ''; syncForm(); render(); });
      body.querySelectorAll('.cat-chip').forEach((b) => b.onclick = () => { form.category = b.dataset.c; body.querySelectorAll('.cat-chip').forEach((x) => x.classList.toggle('on', x.dataset.c === form.category)); });
    };
    const syncForm = () => {
      form.amount = body.querySelector('#fAmt')?.value ?? form.amount;
      form.merchant = body.querySelector('#fMerch')?.value ?? form.merchant;
      form.date = body.querySelector('#fDate')?.value ?? form.date;
      form.account_id = body.querySelector('#fAcc')?.value ?? form.account_id;
      form.note = body.querySelector('#fNote')?.value ?? form.note;
    };
    render();

    const save = makeBtn(existing ? 'Lưu thay đổi' : 'Thêm giao dịch', 'btn btn-primary', () => {
      syncForm();
      const err = body.querySelector('#fErr');
      const showErr = (m) => { err.textContent = m; err.classList.remove('hidden'); };
      if (!form.amount || parseFloat(form.amount) <= 0) return showErr('Nhập số tiền hợp lệ');
      if (!form.category) return showErr('Chọn danh mục');
      if (!form.merchant.trim()) return showErr('Nhập mô tả');
      if (existing) { Store.updateTransaction(existing.id, form); Toast.success('Đã cập nhật giao dịch'); }
      else { Store.addTransaction(form); Toast.success('Đã thêm giao dịch'); }
      Modal.close(); this.renderPage();
    });
    const cancel = makeBtn('Hủy', 'btn btn-ghost', () => Modal.close());
    Modal.open({ title: existing ? 'Sửa giao dịch' : 'Thêm giao dịch', body, footer: [cancel, save] });
  },

  openSettings() {
    const body = el(`<div>
      <p class="muted" style="font-size:14px;line-height:1.6;margin-bottom:16px">Dữ liệu của bạn được lưu ngay trong trình duyệt này (không gửi đi đâu cả).</p>
    </div>`);
    const exportBtn = makeBtn('Xuất dữ liệu (JSON sao lưu)', 'btn btn-outline btn-block', () => {
      const url = URL.createObjectURL(new Blob([Store.export()], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = 'pocketwise-backup.json'; a.click(); URL.revokeObjectURL(url);
      Toast.success('Đã xuất dữ liệu');
    }, 'download');
    exportBtn.style.marginBottom = '10px';
    const importBtn = makeBtn('Nhập dữ liệu từ file JSON', 'btn btn-outline btn-block', () => {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json';
      inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { Store.import(r.result); Toast.success('Đã nhập dữ liệu'); Modal.close(); this.renderShell(); this.renderPage(); } catch { Toast.error('File không hợp lệ'); } }; r.readAsText(f); };
      inp.click();
    }, 'rotate-ccw');
    importBtn.style.marginBottom = '10px';
    const resetBtn = makeBtn('Xóa toàn bộ dữ liệu', 'btn btn-danger btn-block', () => {
      Modal.close();
      confirmDialog({ title: 'Xóa toàn bộ dữ liệu', message: 'Mọi giao dịch, ngân sách, mục tiêu, tài khoản… sẽ bị xóa vĩnh viễn. Bạn chắc chứ?', confirmLabel: 'Xóa hết', onConfirm: () => { Store.reset(); Toast.success('Đã xóa toàn bộ dữ liệu'); this.renderShell(); this.go('overview'); } });
    }, 'trash');
    body.appendChild(exportBtn); body.appendChild(importBtn); body.appendChild(resetBtn);
    Modal.open({ title: 'Tùy chọn & Dữ liệu', size: 'sm', body, footer: [makeBtn('Đóng', 'btn btn-ghost', () => Modal.close())] });
  },
};

window.addEventListener('DOMContentLoaded', () => App.init());


/* ===== js/pages.js ===== */
/* ============================================================
   PocketWise — Các trang còn lại
   Ngân sách, Mục tiêu, Dòng tiền, Tài khoản, Đăng ký, Phân tích
   ============================================================ */

Object.assign(App, {
  /* ========================================================
     NGÂN SÁCH
     ======================================================== */
  pageBudgets(c) {
    const a = Store.analytics();
    const spentMap = {};
    a.byCategory.forEach((cc) => { spentMap[cc.category] = cc.total; });
    const budgets = Store.data.budgets.map((b) => ({ ...b, spent: spentMap[b.category] || 0 }));

    const head = this.pageHeader('Ngân sách', 'Đặt hạn mức hằng tháng và bám sát nó.');
    head.appendChild(makeBtn('Ngân sách mới', 'btn btn-primary', () => this.openBudgetModal(), 'plus'));
    c.appendChild(head);

    if (budgets.length) {
      const totalB = budgets.reduce((a, b) => a + b.amount, 0);
      const totalS = budgets.reduce((a, b) => a + b.spent, 0);
      const ov = el('<div class="card pad" style="margin-bottom:20px"></div>');
      ov.appendChild(el(`<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:12px">
        <div><div class="lbl" style="font-size:11px;text-transform:uppercase;color:var(--ink-400);font-weight:700">Đã chi tháng này</div>
        <div style="font-size:24px;font-weight:800;margin-top:4px" class="tabular">${fmtMoney(totalS)} <span style="font-size:15px;color:var(--ink-400);font-weight:500">/ ${fmtMoney(totalB)}</span></div></div>
        <div style="text-align:right"><div class="lbl" style="font-size:11px;text-transform:uppercase;color:var(--ink-400);font-weight:700">Còn lại</div>
        <div style="font-size:24px;font-weight:800;margin-top:4px;color:${totalB - totalS >= 0 ? 'var(--green)' : 'var(--red)'}" class="tabular">${fmtMoney(totalB - totalS)}</div></div></div>`));
      ov.appendChild(el(progressBar(totalS, totalB, totalS > totalB ? 'var(--red)' : 'var(--brand-500)', 10)));
      c.appendChild(ov);
    }

    if (!budgets.length) {
      const card = el('<div class="card"></div>');
      card.appendChild(emptyState({ icon: 'piggy-bank', title: 'Chưa có ngân sách', message: 'Tạo ngân sách đầu tiên để kiểm soát chi tiêu theo danh mục.', actionLabel: 'Ngân sách mới', onAction: () => this.openBudgetModal() }));
      c.appendChild(card); return;
    }

    const grid = el('<div class="grid g2"></div>');
    budgets.forEach((b) => {
      const pct = (b.spent / b.amount) * 100;
      const over = b.spent > b.amount, near = pct >= 80 && !over;
      const color = over ? 'var(--red)' : near ? 'var(--amber)' : catColor(b.category);
      const card = el(`<div class="card pad"></div>`);
      const head = el(`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:8px;min-width:0"><span style="width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:${catColor(b.category)}1a"><span class="dot" style="width:10px;height:10px;background:${catColor(b.category)}"></span></span><span style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.category)}</span></div></div>`);
      const acts = el('<div class="li-actions" style="opacity:1"></div>');
      const e = el(`<button class="icon-btn">${icon('pencil', 14)}</button>`); e.onclick = () => this.openBudgetModal(b);
      const d = el(`<button class="icon-btn danger">${icon('trash', 14)}</button>`); d.onclick = () => confirmDialog({ title: 'Xóa ngân sách', message: `Xóa ngân sách ${b.category}?`, onConfirm: () => { Store.deleteBudget(b.id); Toast.success('Đã xóa'); this.renderPage(); } });
      acts.appendChild(e); acts.appendChild(d); head.appendChild(acts);
      card.appendChild(head);
      card.appendChild(el(`<div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:8px"><span style="font-size:20px;font-weight:800" class="tabular">${fmtMoney(b.spent)}</span><span class="muted tabular" style="font-size:14px">/ ${fmtMoney(b.amount)}</span></div>`));
      card.appendChild(el(progressBar(Math.min(b.spent, b.amount), b.amount, color, 8)));
      card.appendChild(el(`<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12px"><span style="font-weight:500;color:${over ? 'var(--red)' : near ? 'var(--amber)' : 'var(--ink-400)'}">${over ? `Vượt ${fmtMoney(b.spent - b.amount)}` : near ? 'Sắp chạm hạn mức' : `Còn ${fmtMoney(b.amount - b.spent)}`}</span><span class="muted tabular">${Math.round(pct)}%</span></div>`));
      grid.appendChild(card);
    });
    c.appendChild(grid);
  },

  openBudgetModal(existing) {
    const used = Store.data.budgets.map((b) => b.category);
    const avail = EXPENSE_CATEGORIES.filter((cc) => existing?.category === cc.key || !used.includes(cc.key));
    let form = existing ? { category: existing.category, amount: existing.amount } : { category: '', amount: '' };
    const body = el(`<div>
      <div class="field"><label class="label">Danh mục</label>
        <select class="input" id="bCat" ${existing ? 'disabled' : ''}><option value="">Chọn danh mục</option>${avail.map((cc) => `<option value="${esc(cc.key)}" ${form.category === cc.key ? 'selected' : ''}>${esc(cc.key)}</option>`).join('')}</select></div>
      <div class="field"><label class="label">Hạn mức hằng tháng</label><div class="money-wrap"><input class="input" id="bAmt" type="number" inputmode="numeric" step="1000" min="0" placeholder="0" value="${form.amount}"><span class="cur">₫</span></div></div>
      <div class="err hidden" id="bErr"></div></div>`);
    const save = makeBtn('Lưu', 'btn btn-primary', () => {
      const cat = body.querySelector('#bCat').value, amt = parseFloat(body.querySelector('#bAmt').value);
      const err = body.querySelector('#bErr'); const showErr = (m) => { err.textContent = m; err.classList.remove('hidden'); };
      if (!cat) return showErr('Chọn danh mục');
      if (!amt || amt <= 0) return showErr('Nhập hạn mức hợp lệ');
      if (existing) { Store.updateBudget(existing.id, { amount: amt }); Toast.success('Đã cập nhật'); }
      else { Store.addBudget({ category: cat, amount: amt }); Toast.success('Đã tạo ngân sách'); }
      Modal.close(); this.renderPage();
    });
    Modal.open({ title: existing ? 'Sửa ngân sách' : 'Ngân sách mới', body, footer: [makeBtn('Hủy', 'btn btn-ghost', () => Modal.close()), save] });
  },

  /* ========================================================
     MỤC TIÊU
     ======================================================== */
  pageGoals(c) {
    const head = this.pageHeader('Mục tiêu tiết kiệm', 'Biến mong muốn thành kế hoạch.');
    head.appendChild(makeBtn('Mục tiêu mới', 'btn btn-primary', () => this.openGoalModal(), 'plus'));
    c.appendChild(head);

    const goals = Store.data.goals;
    if (!goals.length) {
      const card = el('<div class="card"></div>');
      card.appendChild(emptyState({ icon: 'target', title: 'Chưa có mục tiêu', message: 'Đặt mục tiêu — quỹ dự phòng, chuyến đi, hay chiếc laptop mới.', actionLabel: 'Mục tiêu mới', onAction: () => this.openGoalModal() }));
      c.appendChild(card); return;
    }
    const grid = el('<div class="grid g2"></div>');
    goals.forEach((g) => {
      const pct = Math.min(100, (g.saved_amount / g.target_amount) * 100);
      const done = g.saved_amount >= g.target_amount;
      const card = el('<div class="card pad"></div>');
      const head = el(`<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:12px;min-width:0"><div style="width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:${g.color}1a;color:${g.color}">${icon(g.icon || 'target', 20)}</div>
        <div style="min-width:0"><div style="font-weight:700;display:flex;align-items:center;gap:6px;overflow:hidden">${esc(g.name)} ${done ? icon('check', 15, '') : ''}</div>${g.target_date ? `<div class="muted" style="font-size:12px">đến ${fmtDate(g.target_date)}</div>` : ''}</div></div></div>`);
      const acts = el('<div class="li-actions" style="opacity:1"></div>');
      const e = el(`<button class="icon-btn">${icon('pencil', 14)}</button>`); e.onclick = () => this.openGoalModal(g);
      const d = el(`<button class="icon-btn danger">${icon('trash', 14)}</button>`); d.onclick = () => confirmDialog({ title: 'Xóa mục tiêu', message: `Xóa "${g.name}"?`, onConfirm: () => { Store.deleteGoal(g.id); Toast.success('Đã xóa'); this.renderPage(); } });
      acts.appendChild(e); acts.appendChild(d); head.appendChild(acts); card.appendChild(head);
      card.appendChild(el(`<div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:8px"><span style="font-size:20px;font-weight:800" class="tabular">${fmtMoney(g.saved_amount)}</span><span class="muted tabular" style="font-size:14px">/ ${fmtMoney(g.target_amount)}</span></div>`));
      card.appendChild(el(progressBar(g.saved_amount, g.target_amount, g.color, 10)));
      const foot = el(`<div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px"><span style="font-size:12px;font-weight:500;color:var(--ink-500)">${done ? '🎉 Đã hoàn thành!' : `Còn ${fmtMoney(g.target_amount - g.saved_amount)}`}</span></div>`);
      const btns = el('<div style="display:flex;gap:6px"></div>');
      const minus = el(`<button class="btn btn-outline" style="padding:6px 10px">${icon('minus', 13)}</button>`); minus.disabled = g.saved_amount <= 0; minus.onclick = () => { Store.updateGoal(g.id, { saved_amount: Math.max(0, g.saved_amount - 50000) }); this.renderPage(); };
      const add = makeBtn('Nạp', 'btn btn-outline', () => this.openContribModal(g), 'plus'); add.style.padding = '6px 12px';
      btns.appendChild(minus); btns.appendChild(add); foot.appendChild(btns); card.appendChild(foot);
      grid.appendChild(card);
    });
    c.appendChild(grid);
  },

  openContribModal(g) {
    let val = '';
    const body = el(`<div>
      <div class="field"><label class="label">Số tiền nạp vào</label><div class="money-wrap"><input class="input" id="cAmt" type="number" inputmode="numeric" step="1000" min="0" placeholder="0" style="font-size:18px;font-weight:700"><span class="cur">₫</span></div></div>
      <div class="quick-amts">${[50000, 100000, 200000, 500000].map((v) => `<button type="button" class="btn btn-outline" data-v="${v}">${fmtCompact(v)}</button>`).join('')}</div></div>`);
    body.querySelectorAll('[data-v]').forEach((b) => b.onclick = () => { body.querySelector('#cAmt').value = b.dataset.v; });
    const save = makeBtn('Nạp vào mục tiêu', 'btn btn-primary', () => {
      const amt = parseFloat(body.querySelector('#cAmt').value);
      if (!amt || amt <= 0) return Toast.error('Nhập số tiền hợp lệ');
      Store.updateGoal(g.id, { saved_amount: Math.min(g.target_amount, g.saved_amount + amt) });
      Toast.success(`Đã nạp ${fmtMoney(amt)} vào ${g.name}`); Modal.close(); this.renderPage();
    });
    Modal.open({ title: `Nạp vào ${g.name}`, size: 'sm', body, footer: [makeBtn('Hủy', 'btn btn-ghost', () => Modal.close()), save] });
  },

  openGoalModal(existing) {
    const ICON_OPTS = ['target', 'shield', 'plane', 'laptop', 'book', 'piggy-bank'];
    const COLORS = ['#16a34a', '#337bff', '#8b5cf6', '#06b6d4', '#f59e0b', '#ec4899', '#ef4444'];
    let form = existing ? { ...existing } : { name: '', target_amount: '', saved_amount: '', target_date: '', color: '#16a34a', icon: 'target' };
    const body = el(`<div>
      <div class="field"><label class="label">Tên mục tiêu</label><input class="input" id="gName" placeholder="VD: Quỹ dự phòng" value="${esc(form.name)}"></div>
      <div class="row">
        <div class="field"><label class="label">Số tiền mục tiêu</label><div class="money-wrap"><input class="input" id="gTarget" type="number" inputmode="numeric" step="1000" min="0" placeholder="0" value="${form.target_amount}"><span class="cur">₫</span></div></div>
        <div class="field"><label class="label">Đã có</label><div class="money-wrap"><input class="input" id="gSaved" type="number" inputmode="numeric" step="1000" min="0" placeholder="0" value="${form.saved_amount}"><span class="cur">₫</span></div></div>
      </div>
      <div class="field"><label class="label">Ngày mục tiêu (tùy chọn)</label><input class="input" id="gDate" type="date" value="${form.target_date || ''}"></div>
      <div class="field"><label class="label">Biểu tượng</label><div class="icon-pick" id="gIcons">${ICON_OPTS.map((ic) => `<button type="button" class="icon-opt ${form.icon === ic ? 'on' : ''}" data-i="${ic}">${icon(ic, 18)}</button>`).join('')}</div></div>
      <div class="field"><label class="label">Màu</label><div class="swatches" id="gColors">${COLORS.map((cl) => `<button type="button" class="swatch ${form.color === cl ? 'on' : ''}" data-c="${cl}" style="background:${cl}"></button>`).join('')}</div></div>
      <div class="err hidden" id="gErr"></div></div>`);
    body.querySelectorAll('#gIcons .icon-opt').forEach((b) => b.onclick = () => { form.icon = b.dataset.i; body.querySelectorAll('#gIcons .icon-opt').forEach((x) => x.classList.toggle('on', x.dataset.i === form.icon)); });
    body.querySelectorAll('#gColors .swatch').forEach((b) => b.onclick = () => { form.color = b.dataset.c; body.querySelectorAll('#gColors .swatch').forEach((x) => x.classList.toggle('on', x.dataset.c === form.color)); });
    const save = makeBtn('Lưu', 'btn btn-primary', () => {
      const name = body.querySelector('#gName').value, target = parseFloat(body.querySelector('#gTarget').value);
      const err = body.querySelector('#gErr'); const showErr = (m) => { err.textContent = m; err.classList.remove('hidden'); };
      if (!name.trim()) return showErr('Nhập tên mục tiêu');
      if (!target || target <= 0) return showErr('Nhập số tiền mục tiêu hợp lệ');
      const payload = { name, target_amount: target, saved_amount: parseFloat(body.querySelector('#gSaved').value) || 0, target_date: body.querySelector('#gDate').value, color: form.color, icon: form.icon };
      if (existing) { Store.updateGoal(existing.id, payload); Toast.success('Đã cập nhật'); }
      else { Store.addGoal(payload); Toast.success('Đã tạo mục tiêu'); }
      Modal.close(); this.renderPage();
    });
    Modal.open({ title: existing ? 'Sửa mục tiêu' : 'Mục tiêu mới', body, footer: [makeBtn('Hủy', 'btn btn-ghost', () => Modal.close()), save] });
  },

  /* ========================================================
     DÒNG TIỀN (FORECAST)
     ======================================================== */
  pageForecast(c) {
    const a = Store.analytics(); const f = a.forecast;
    c.appendChild(this.pageHeader('Dự báo dòng tiền', 'Số dư của bạn sẽ đi về đâu trong 90 ngày tới.'));

    const stats = el('<div class="grid g3" style="margin-bottom:20px"></div>');
    stats.appendChild(this.statCard('Dự kiến (90 ngày)', fmtMoney(f.endBalance), 'Số dư ước tính', 'calendar', true));
    stats.appendChild(this.statCard('Dòng tiền/ngày', fmtMoney(f.dailyNet), f.dailyNet >= 0 ? 'Đang tăng' : 'Đang giảm', f.dailyNet >= 0 ? 'trending-up' : 'trending-down'));
    stats.appendChild(this.statCard('Điểm thấp nhất', fmtMoney(f.lowest), f.lowest < 0 ? 'Có thể âm ⚠️' : 'Luôn dương', 'alert-triangle'));
    c.appendChild(stats);

    const chartCard = el('<div class="card pad" style="margin-bottom:20px"></div>');
    chartCard.appendChild(el(`<div class="sec-head"><div><h2>Số dư dự kiến</h2><div class="h-sub">Dựa trên 60 ngày gần nhất và các hóa đơn định kỳ</div></div></div>`));
    const hasData = Store.data.transactions.length > 0 || Store.data.accounts.length > 0;
    if (hasData) chartCard.appendChild(el(areaChart([{ name: 'Số dư', color: '#337bff', data: f.points.map((p) => ({ label: p.label, value: p.balance })) }], { height: 260 })));
    else chartCard.appendChild(emptyState({ icon: 'line-chart', title: 'Chưa đủ dữ liệu', message: 'Thêm tài khoản và giao dịch để dự báo dòng tiền.' }));
    c.appendChild(chartCard);

    const grid = el('<div class="grid g2"></div>');
    const upCard = el('<div class="card pad"></div>');
    upCard.appendChild(el(`<div class="sec-head"><div><h2>Khoản sắp trừ</h2><div class="h-sub">Hóa đơn & đăng ký đã tính vào dự báo</div></div></div>`));
    if (f.upcoming.length) { const ul = el('<ul class="list"></ul>'); f.upcoming.forEach((u) => ul.appendChild(el(`<li class="li"><div class="li-main"><div class="li-title">${esc(u.name)}</div><div class="li-sub">${relativeDay(u.date)} · ${fmtDateShort(u.date)}</div></div><span class="amt expense">−${fmtMoney(u.amount)}</span></li>`))); upCard.appendChild(ul); }
    else upCard.appendChild(emptyState({ icon: 'calendar', title: 'Không có khoản nào', message: 'Thêm đăng ký để hiển thị tại đây.' }));
    grid.appendChild(upCard);

    const howCard = el('<div class="card pad"></div>');
    howCard.appendChild(el(`<div class="sec-head"><div><h2>Cách tính</h2><div class="h-sub">Dự báo đơn giản để bạn hành động</div></div></div>`));
    const steps = [
      `Lấy trung bình thu - chi 60 ngày gần nhất để ước tính dòng tiền <b>${fmtMoney(f.dailyNet)}/ngày</b>.`,
      'Các khoản đăng ký & hóa đơn được trừ vào đúng ngày đến hạn.',
      f.lowest < 0 ? 'Lưu ý: số dư có thể xuống dưới 0. Hãy tạo khoản dự phòng hoặc cắt giảm chi.' : 'Bạn đang trên đà giữ số dư dương — tốt lắm!',
    ];
    const ol = el('<div style="display:flex;flex-direction:column;gap:12px"></div>');
    steps.forEach((s, i) => ol.appendChild(el(`<div style="display:flex;gap:12px;font-size:14px;color:var(--ink-600)"><span style="width:24px;height:24px;border-radius:8px;background:var(--brand-50);color:var(--brand-600);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0">${i + 1}</span><span style="line-height:1.5">${s}</span></div>`)));
    howCard.appendChild(ol);
    grid.appendChild(howCard);
    c.appendChild(grid);
  },

  /* ========================================================
     TÀI KHOẢN
     ======================================================== */
  pageAccounts(c) {
    const TYPE_ICON = { checking: 'wallet', savings: 'piggy-bank', cash: 'banknote', credit: 'credit-card', investment: 'trending-up' };
    const accounts = Store.data.accounts.filter((a) => !a.archived);
    const head = this.pageHeader('Tài khoản', 'Tổng hợp mọi số dư trong một màn hình.');
    head.appendChild(makeBtn('Thêm tài khoản', 'btn btn-primary', () => this.openAccountModal(), 'plus'));
    c.appendChild(head);

    if (accounts.length) {
      const net = accounts.reduce((a, x) => a + x.balance, 0);
      const assets = accounts.filter((a) => a.balance >= 0).reduce((a, x) => a + x.balance, 0);
      const debt = accounts.filter((a) => a.balance < 0).reduce((a, x) => a + x.balance, 0);
      const stats = el('<div class="grid g3" style="margin-bottom:20px"></div>');
      stats.appendChild(this.statCard('Giá trị ròng', fmtMoney(net), '', 'landmark', true));
      stats.appendChild(this.statCard('Tổng tài sản', fmtMoney(assets), '', 'trending-up'));
      stats.appendChild(this.statCard('Tổng nợ', fmtMoney(Math.abs(debt)), '', 'credit-card'));
      c.appendChild(stats);
    }

    if (!accounts.length) {
      const card = el('<div class="card"></div>');
      card.appendChild(emptyState({ icon: 'landmark', title: 'Chưa có tài khoản', message: 'Thêm tài khoản thanh toán, tiết kiệm, tiền mặt hay thẻ tín dụng.', actionLabel: 'Thêm tài khoản', onAction: () => this.openAccountModal() }));
      c.appendChild(card); return;
    }
    const grid = el('<div class="grid g2"></div>');
    accounts.forEach((ac) => {
      const typeLabel = (ACCOUNT_TYPES.find((t) => t.key === ac.type) || {}).label || ac.type;
      const card = el(`<div class="card pad" style="position:relative;overflow:hidden"><div style="position:absolute;top:0;left:0;width:6px;height:100%;background:${ac.color}"></div></div>`);
      const head = el(`<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;padding-left:8px">
        <div style="display:flex;align-items:center;gap:12px"><div style="width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:${ac.color}1a;color:${ac.color}">${icon(TYPE_ICON[ac.type] || 'wallet', 20)}</div>
        <div><div style="font-weight:700">${esc(ac.name)}</div><div class="muted" style="font-size:12px">${typeLabel}${ac.institution ? ' · ' + esc(ac.institution) : ''}</div></div></div></div>`);
      const acts = el('<div class="li-actions" style="opacity:1"></div>');
      const e = el(`<button class="icon-btn">${icon('pencil', 14)}</button>`); e.onclick = () => this.openAccountModal(ac);
      const d = el(`<button class="icon-btn danger">${icon('trash', 14)}</button>`); d.onclick = () => confirmDialog({ title: 'Xóa tài khoản', message: `Xóa "${ac.name}"? Giao dịch liên quan được giữ lại nhưng gỡ liên kết.`, onConfirm: () => { Store.deleteAccount(ac.id); Toast.success('Đã xóa'); this.renderPage(); } });
      acts.appendChild(e); acts.appendChild(d); head.appendChild(acts); card.appendChild(head);
      card.appendChild(el(`<div style="padding-left:8px"><div class="muted" style="font-size:12px;margin-bottom:2px">${ac.balance < 0 ? 'Số tiền nợ' : 'Số dư hiện tại'}</div><div style="font-size:24px;font-weight:800;color:${ac.balance < 0 ? 'var(--red)' : 'var(--ink-900)'}" class="tabular">${fmtMoney(ac.balance)}</div></div>`));
      grid.appendChild(card);
    });
    c.appendChild(grid);
  },

  openAccountModal(existing) {
    const COLORS = ['#337bff', '#16a34a', '#8b5cf6', '#f59e0b', '#ef4444', '#06b6d4', '#ec4899'];
    let form = existing ? { ...existing } : { name: '', type: 'checking', institution: '', balance: '', color: '#337bff' };
    const body = el(`<div>
      <div class="field"><label class="label">Tên tài khoản</label><input class="input" id="aName" placeholder="VD: Vietcombank" value="${esc(form.name)}"></div>
      <div class="row">
        <div class="field"><label class="label">Loại</label><select class="input" id="aType">${ACCOUNT_TYPES.map((t) => `<option value="${t.key}" ${form.type === t.key ? 'selected' : ''}>${t.label}</option>`).join('')}</select></div>
        <div class="field"><label class="label">Số dư</label><div class="money-wrap"><input class="input" id="aBal" type="number" inputmode="numeric" step="1000" placeholder="0" value="${form.balance}"><span class="cur">₫</span></div></div>
      </div>
      <div class="field"><label class="label">Ngân hàng (tùy chọn)</label><input class="input" id="aInst" placeholder="VD: Techcombank, MoMo" value="${esc(form.institution)}"></div>
      <div class="field"><label class="label">Màu</label><div class="swatches" id="aColors">${COLORS.map((cl) => `<button type="button" class="swatch ${form.color === cl ? 'on' : ''}" data-c="${cl}" style="background:${cl}"></button>`).join('')}</div></div>
      <p class="muted" style="font-size:12px">Mẹo: nhập số âm cho thẻ tín dụng hoặc khoản nợ.</p>
      <div class="err hidden" id="aErr"></div></div>`);
    body.querySelectorAll('#aColors .swatch').forEach((b) => b.onclick = () => { form.color = b.dataset.c; body.querySelectorAll('#aColors .swatch').forEach((x) => x.classList.toggle('on', x.dataset.c === form.color)); });
    const save = makeBtn('Lưu', 'btn btn-primary', () => {
      const name = body.querySelector('#aName').value;
      const err = body.querySelector('#aErr');
      if (!name.trim()) { err.textContent = 'Nhập tên tài khoản'; err.classList.remove('hidden'); return; }
      const payload = { name, type: body.querySelector('#aType').value, institution: body.querySelector('#aInst').value, balance: parseFloat(body.querySelector('#aBal').value) || 0, color: form.color };
      if (existing) { Store.updateAccount(existing.id, payload); Toast.success('Đã cập nhật'); }
      else { Store.addAccount(payload); Toast.success('Đã thêm tài khoản'); }
      Modal.close(); this.renderPage();
    });
    Modal.open({ title: existing ? 'Sửa tài khoản' : 'Thêm tài khoản', body, footer: [makeBtn('Hủy', 'btn btn-ghost', () => Modal.close()), save] });
  },

  /* ========================================================
     ĐĂNG KÝ (SUBSCRIPTIONS)
     ======================================================== */
  pageSubscriptions(c) {
    const mCost = (s) => s.cycle === 'yearly' ? s.amount / 12 : s.cycle === 'weekly' ? s.amount * 4.33 : s.amount;
    const CYCLE_LABEL = { weekly: 'Hằng tuần', monthly: 'Hằng tháng', yearly: 'Hằng năm' };
    const subs = Store.data.subscriptions;
    const active = subs.filter((s) => s.status === 'active');

    const head = this.pageHeader('Đăng ký & Hóa đơn', 'Theo dõi các khoản định kỳ trước khi bị bất ngờ.');
    head.appendChild(makeBtn('Thêm', 'btn btn-primary', () => this.openSubModal(), 'plus'));
    c.appendChild(head);

    if (subs.length) {
      const monthly = active.reduce((a, s) => a + mCost(s), 0);
      const due7 = active.filter((s) => { const d = (parseDate(s.next_due) - new Date()) / 86400000; return d >= -1 && d <= 7; }).reduce((a, s) => a + s.amount, 0);
      const stats = el('<div class="grid g3" style="margin-bottom:20px"></div>');
      stats.appendChild(this.statCard('Chi phí/tháng', fmtMoney(monthly), `${active.length} đang hoạt động`, 'repeat', true));
      stats.appendChild(this.statCard('Chi phí/năm', fmtMoney(monthly * 12), 'Dự kiến', 'calendar'));
      stats.appendChild(this.statCard('Đến hạn 7 ngày', fmtMoney(due7), 'Sắp tới', 'calendar'));
      c.appendChild(stats);
    }

    if (!subs.length) {
      const card = el('<div class="card"></div>');
      card.appendChild(emptyState({ icon: 'repeat', title: 'Chưa theo dõi đăng ký nào', message: 'Thêm Netflix, Spotify, phòng gym… bất cứ khoản nào trừ tiền định kỳ.', actionLabel: 'Thêm đăng ký', onAction: () => this.openSubModal() }));
      c.appendChild(card); return;
    }
    const card = el('<div class="card"></div>');
    const ul = el('<ul class="list"></ul>');
    subs.sort((a, b) => (a.next_due < b.next_due ? -1 : 1)).forEach((s) => {
      const paused = s.status !== 'active';
      const li = el(`<li class="li" style="${paused ? 'opacity:.6' : ''}">
        <div class="li-ic" style="background:${s.color};color:#fff;font-weight:700">${esc(s.name.slice(0, 1).toUpperCase())}</div>
        <div class="li-main"><div class="li-title">${esc(s.name)}${paused ? ' <span class="tag" style="background:var(--ink-100);color:var(--ink-500)">Tạm dừng</span>' : ''}</div>
        <div class="li-sub">${paused ? 'Không tính phí' : 'Kế tiếp: ' + relativeDay(s.next_due)} · ${CYCLE_LABEL[s.cycle]}</div></div>
        <div style="text-align:right"><div class="amt expense">${fmtMoney(s.amount)}</div><div class="muted" style="font-size:11px">${fmtMoney(mCost(s))}/th</div></div></li>`);
      const acts = el('<div class="li-actions"></div>');
      const toggle = el(`<button class="icon-btn">${icon(paused ? 'play' : 'pause', 14)}</button>`); toggle.onclick = () => { Store.updateSubscription(s.id, { status: paused ? 'active' : 'paused' }); Toast.success(paused ? 'Đã tiếp tục' : 'Đã tạm dừng'); this.renderPage(); };
      const e = el(`<button class="icon-btn">${icon('pencil', 14)}</button>`); e.onclick = () => this.openSubModal(s);
      const d = el(`<button class="icon-btn danger">${icon('trash', 14)}</button>`); d.onclick = () => confirmDialog({ title: 'Xóa đăng ký', message: `Ngừng theo dõi "${s.name}"?`, onConfirm: () => { Store.deleteSubscription(s.id); Toast.success('Đã xóa'); this.renderPage(); } });
      acts.appendChild(toggle); acts.appendChild(e); acts.appendChild(d); li.appendChild(acts);
      ul.appendChild(li);
    });
    card.appendChild(ul); c.appendChild(card);
  },

  openSubModal(existing) {
    const CYCLES = [{ k: 'weekly', l: 'Hằng tuần' }, { k: 'monthly', l: 'Hằng tháng' }, { k: 'yearly', l: 'Hằng năm' }];
    const COLORS = ['#8b5cf6', '#ef4444', '#22c55e', '#0ea5e9', '#f59e0b', '#ec4899', '#10a37f'];
    const accounts = Store.data.accounts;
    let form = existing ? { ...existing } : { name: '', amount: '', cycle: 'monthly', category: 'Đăng ký (Subscription)', next_due: todayStr(), account_id: '', color: '#8b5cf6' };
    const body = el(`<div>
      <div class="field"><label class="label">Tên</label><input class="input" id="sName" placeholder="VD: Netflix" value="${esc(form.name)}"></div>
      <div class="row">
        <div class="field"><label class="label">Số tiền</label><div class="money-wrap"><input class="input" id="sAmt" type="number" inputmode="numeric" step="1000" min="0" placeholder="0" value="${form.amount}"><span class="cur">₫</span></div></div>
        <div class="field"><label class="label">Chu kỳ</label><select class="input" id="sCycle">${CYCLES.map((cy) => `<option value="${cy.k}" ${form.cycle === cy.k ? 'selected' : ''}>${cy.l}</option>`).join('')}</select></div>
      </div>
      <div class="row">
        <div class="field"><label class="label">Ngày đến hạn kế tiếp</label><input class="input" id="sDue" type="date" value="${form.next_due}"></div>
        <div class="field"><label class="label">Danh mục</label><select class="input" id="sCat">${EXPENSE_CATEGORIES.map((cc) => `<option value="${esc(cc.key)}" ${form.category === cc.key ? 'selected' : ''}>${esc(cc.key)}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label class="label">Tài khoản (tùy chọn)</label><select class="input" id="sAcc"><option value="">Không</option>${accounts.map((ac) => `<option value="${ac.id}" ${form.account_id === ac.id ? 'selected' : ''}>${esc(ac.name)}</option>`).join('')}</select></div>
      <div class="field"><label class="label">Màu</label><div class="swatches" id="sColors">${COLORS.map((cl) => `<button type="button" class="swatch ${form.color === cl ? 'on' : ''}" data-c="${cl}" style="background:${cl}"></button>`).join('')}</div></div>
      <div class="err hidden" id="sErr"></div></div>`);
    body.querySelectorAll('#sColors .swatch').forEach((b) => b.onclick = () => { form.color = b.dataset.c; body.querySelectorAll('#sColors .swatch').forEach((x) => x.classList.toggle('on', x.dataset.c === form.color)); });
    const save = makeBtn('Lưu', 'btn btn-primary', () => {
      const name = body.querySelector('#sName').value, amt = parseFloat(body.querySelector('#sAmt').value);
      const err = body.querySelector('#sErr'); const showErr = (m) => { err.textContent = m; err.classList.remove('hidden'); };
      if (!name.trim()) return showErr('Nhập tên');
      if (!amt || amt <= 0) return showErr('Nhập số tiền hợp lệ');
      const payload = { name, amount: amt, cycle: body.querySelector('#sCycle').value, category: body.querySelector('#sCat').value, next_due: body.querySelector('#sDue').value, account_id: body.querySelector('#sAcc').value, color: form.color };
      if (existing) { Store.updateSubscription(existing.id, payload); Toast.success('Đã cập nhật'); }
      else { Store.addSubscription(payload); Toast.success('Đã thêm đăng ký'); }
      Modal.close(); this.renderPage();
    });
    Modal.open({ title: existing ? 'Sửa đăng ký' : 'Thêm đăng ký', body, footer: [makeBtn('Hủy', 'btn btn-ghost', () => Modal.close()), save] });
  },

  /* ========================================================
     PHÂN TÍCH (INSIGHTS)
     ======================================================== */
  pageInsights(c) {
    const a = Store.analytics();
    c.appendChild(this.pageHeader('Phân tích', 'Những gợi ý thông minh từ thói quen chi tiêu của bạn.'));

    const ins = el('<div class="grid g2" style="margin-bottom:20px"></div>');
    a.insights.forEach((it) => {
      const iconName = it.type === 'good' ? 'check-circle' : it.type === 'warn' ? 'alert-triangle' : 'info';
      ins.appendChild(el(`<div class="insight in-${it.type}"><div class="in-ic">${icon(iconName, 18)}</div><div><h4>${esc(it.title)}</h4><p>${esc(it.body)}</p></div></div>`));
    });
    c.appendChild(ins);

    const grid = el('<div class="grid g2" style="margin-bottom:20px"></div>');
    // daily spend
    const dailyCard = el('<div class="card pad"></div>');
    dailyCard.appendChild(el(`<div class="sec-head"><div><h2>Chi tiêu hằng ngày</h2><div class="h-sub">30 ngày gần nhất</div></div></div>`));
    if (a.daily.some((d) => d.amount > 0)) dailyCard.appendChild(el(barChart(a.daily.map((d) => ({ label: d.label, value: d.amount })))));
    else dailyCard.appendChild(emptyState({ icon: 'trending-up', title: 'Chưa có dữ liệu', message: 'Thêm khoản chi để xem biểu đồ.' }));
    grid.appendChild(dailyCard);

    // category breakdown
    const catCard = el('<div class="card pad"></div>');
    catCard.appendChild(el(`<div class="sec-head"><div><h2>Cơ cấu danh mục</h2><div class="h-sub">Tháng này</div></div></div>`));
    if (a.byCategory.length) {
      const max = a.byCategory[0].total;
      const box = el('<div style="display:flex;flex-direction:column;gap:12px"></div>');
      a.byCategory.slice(0, 7).forEach((cc) => box.appendChild(el(`<div><div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px"><span style="display:flex;align-items:center;gap:8px;color:var(--ink-700)"><span class="dot" style="background:${catColor(cc.category)}"></span>${esc(cc.category)}</span><span style="font-weight:600" class="tabular">${fmtMoney(cc.total)}</span></div>${progressBar(cc.total, max, catColor(cc.category), 8)}</div>`)));
      catCard.appendChild(box);
    } else catCard.appendChild(emptyState({ icon: 'trending-up', title: 'Chưa có dữ liệu', message: 'Thêm khoản chi để xem cơ cấu.' }));
    grid.appendChild(catCard);
    c.appendChild(grid);

    // top merchants
    const merCard = el('<div class="card pad"></div>');
    merCard.appendChild(el(`<div class="sec-head"><div><h2 style="display:flex;align-items:center;gap:8px">${icon('store', 16, 'brand')} Nơi chi nhiều nhất</h2><div class="h-sub">Tháng này</div></div></div>`));
    if (a.topMerchants.length) {
      const box = el('<div class="grid g3"></div>');
      a.topMerchants.forEach((m, i) => box.appendChild(el(`<div style="display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--ink-50)"><span style="width:28px;height:28px;border-radius:9px;background:#fff;color:var(--ink-500);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0">#${i + 1}</span><div style="min-width:0;flex:1"><div class="li-title">${esc(m.merchant)}</div><div class="muted" style="font-size:12px">${m.count} lần</div></div><span style="font-weight:600" class="tabular">${fmtMoney(m.total)}</span></div>`)));
      merCard.appendChild(box);
    } else merCard.appendChild(el('<p class="muted" style="font-size:14px">Chưa ghi nhận chi tiêu nào.</p>'));
    c.appendChild(merCard);
  },
});

  </script>
